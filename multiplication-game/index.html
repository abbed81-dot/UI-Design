<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>مزرعة جدول الضرب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: one calm column. Each screen shows one main thing (the table grid, the picture, the question),
   with secondary actions as quiet text buttons. Flat surfaces, no heavy borders, one green accent. */
:root{
  --bg:#F5F7F2;
  --surface:#FFFFFF;
  --soft:#EDF1E8;
  --ink:#25362C;
  --muted:#7B8A80;
  --line:#E2E8DC;
  --road:#E3EAD6;
  --accent:#3E9B4F;
  --accent-ink:#FFFFFF;
  --accent-soft:#E3F2E3;
  --sun:#F2B630;
  --sun-soft:#FDF1D3;
  --bad:#D9534F;
  --bad-soft:#FBE7E6;
  --focus:#3A86C8;
  --shadow:0 1px 2px rgba(37,54,44,.05),0 6px 20px rgba(37,54,44,.05);
  --f-display:"Baloo Bhaijaan 2","Tajawal","Segoe UI","Noto Sans Arabic",system-ui,sans-serif;
  --f-body:"Tajawal","Segoe UI","Noto Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11181C; --surface:#182228; --soft:#1F2B31; --ink:#E6EEE7; --muted:#93A39A; --line:#26343B; --road:#22313A;
    --accent:#5DBB6C; --accent-ink:#0E1A12; --accent-soft:#1E3326; --sun:#F5C451; --sun-soft:#3A3220;
    --bad:#F07470; --bad-soft:#3A2224; --focus:#6DB1EA; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.18);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11181C; --surface:#182228; --soft:#1F2B31; --ink:#E6EEE7; --muted:#93A39A; --line:#26343B; --road:#22313A;
  --accent:#5DBB6C; --accent-ink:#0E1A12; --accent-soft:#1E3326; --sun:#F5C451; --sun-soft:#3A3220;
  --bad:#F07470; --bad-soft:#3A2224; --focus:#6DB1EA; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.18);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:14px}
.app{max-width:640px;margin:0 auto;padding-block:16px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance;font-weight:700}
p{margin:0}

/* ---------- shared controls ---------- */
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.15rem;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border-radius:14px;font-family:var(--f-display);font-weight:700;font-size:1.12rem;background:var(--accent);color:var(--accent-ink)}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.link{min-height:44px;padding:0 14px;border-radius:12px;font-weight:700;color:var(--muted)}
.link:hover{background:var(--soft);color:var(--ink)}
.link:disabled{opacity:.3;pointer-events:none}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.head{display:flex;align-items:center;gap:8px;min-height:44px;margin-bottom:8px}
.head h2{font-size:1.15rem;flex:1;min-width:0;color:var(--muted);font-weight:500;font-family:var(--f-body)}

/* ---------- home ---------- */
.home-top{display:flex;align-items:center;justify-content:space-between}
.star-count{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;color:var(--muted)}
.star-count b{color:var(--sun)}
.intro{padding:14px 0 6px;display:grid;gap:12px}
.intro h1{font-size:clamp(1.8rem,6vw,2.3rem);font-weight:800;color:var(--accent)}
.hello{display:flex;align-items:flex-end;gap:10px}
.hello-sheep{font-size:3rem;line-height:1;animation:hop 2.4s ease-in-out infinite;flex:none}
.bubble{position:relative;background:var(--surface);box-shadow:var(--shadow);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700;max-width:30ch;line-height:1.45}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;background:var(--soft);font-weight:700;font-size:.95rem}
.pill:hover{background:var(--line)}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}55%{transform:translateY(0)}}

/* winding trail */
.trail{--amp:min(84px,19vw);position:relative;display:flex;flex-direction:column;align-items:center;gap:40px;padding:34px 0 26px}
.trail-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.road{fill:none;stroke:var(--road);stroke-width:30;stroke-linecap:round;stroke-linejoin:round}
.road-line{fill:none;stroke:var(--surface);stroke-width:3;stroke-linecap:round;stroke-dasharray:1 14}
.road-done{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;opacity:.75}
.deco{position:absolute;transform:translate(-50%,-50%);font-size:1.7rem;line-height:1;pointer-events:none;opacity:.9}
.node{position:relative;display:grid;justify-items:center;gap:6px;transform:translateX(calc(var(--x) * var(--amp)))}
.disc{position:relative;width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;background:var(--surface);box-shadow:0 0 0 4px var(--accent),0 7px 0 4px color-mix(in srgb,var(--accent) 45%,var(--bg));transition:transform .15s}
.node:active .disc{transform:translateY(4px) scale(.97)}
.node .badge{position:absolute;top:-6px;inset-inline-start:-6px;min-width:30px;height:30px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:1rem;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.node .n-stars{font-size:1rem;letter-spacing:2px;line-height:1;color:var(--line)}
.node .n-stars .on{color:var(--sun)}
.node .n-label{font-family:var(--f-display);font-weight:700;font-size:.95rem;color:var(--muted)}
.node.locked .disc{background:var(--soft);box-shadow:0 0 0 3px var(--line);font-size:2rem}
.node.locked .disc>.em{opacity:.35;filter:grayscale(1)}
.node.locked .badge{background:var(--line);color:var(--muted)}
.node.current .disc{box-shadow:0 0 0 5px var(--sun),0 7px 0 5px color-mix(in srgb,var(--sun) 50%,var(--bg))}
.node.current .badge{background:var(--sun);color:#3A2A00}
.mascot{position:absolute;top:14px;font-size:2.1rem;line-height:1;animation:hop 1.4s ease-in-out infinite;pointer-events:none}
.mascot.on-left{left:-50px}
.mascot.on-right{right:-50px}
.mascot::after{content:"هنا!";position:absolute;top:-16px;inset-inline-end:-6px;font-family:var(--f-display);font-size:.8rem;font-weight:800;background:var(--sun);color:#3A2A00;border-radius:99px;padding:0 7px;line-height:1.7;white-space:nowrap}
.node.champ .disc{width:96px;height:96px;font-size:2.8rem}
.goal-flag{text-align:center;color:var(--muted);font-size:.9rem;margin-top:-6px}

/* ---------- sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(12,22,16,.38);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--bg);border-radius:24px 24px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.s-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.s-head .big{font-size:2.8rem;line-height:1}
.s-head h2{font-size:1.5rem}
.s-head p{color:var(--muted);font-size:.95rem}
.s-head .icon-btn{margin-inline-start:auto}
.acts{display:grid;gap:8px}
.act{display:flex;align-items:center;gap:14px;text-align:start;padding:12px 14px;border-radius:16px;background:var(--surface)}
.act .ai{font-size:1.6rem}
.act b{font-family:var(--f-display);font-size:1.12rem;display:block;line-height:1.25}
.act small{color:var(--muted);display:block;line-height:1.35}
.act.primary{background:var(--accent);color:var(--accent-ink)}
.act.primary small{color:inherit;opacity:.85}
.note{color:var(--muted);font-size:.92rem;margin-top:14px;line-height:1.5}
.locked-note{background:var(--soft);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:.95rem}
details{margin-top:8px;font-size:.9rem;color:var(--muted)}
summary{cursor:pointer;font-weight:700;padding:6px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"‹ ";display:inline-block;transition:transform .2s}
details[open] summary::before{transform:rotate(-90deg)}
.rules{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:6px 2px 2px;max-width:320px}
.rules b{color:var(--ink);text-align:end}

/* ---------- equation ---------- */
.eq{display:flex;justify-content:center;align-items:center;gap:.3em;font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,11vw,3.4rem);line-height:1.15;font-variant-numeric:tabular-nums}
.eq .op{color:var(--muted);font-weight:500}
.eq .ans{min-width:1.6em;text-align:center;border-bottom:4px solid var(--line);color:var(--muted)}
.eq .ans.ok{color:var(--accent);border-color:transparent}
.eq .ans.bad{color:var(--bad);border-color:transparent}
.sentence{text-align:center;color:var(--muted);font-size:1rem}

/* ---------- picture: a groups of b ---------- */
.scene{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:14px;background:var(--soft);border-radius:22px;margin:14px 0}
.group{position:relative;display:grid;justify-items:center;gap:2px;padding:6px 6px 20px;border-radius:14px;background:var(--surface);animation:pop .3s both;animation-delay:var(--d,0ms);transition:background .2s,box-shadow .2s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.g-head{font-size:1.8em;line-height:1}
.g-items{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:1px;line-height:1.15}
.g-sum{position:absolute;bottom:1px;inset-inline:0;text-align:center;font-family:var(--f-display);font-weight:700;font-size:.9rem;color:var(--accent);opacity:0;transition:opacity .2s}
.group.lit{background:var(--sun-soft);box-shadow:0 0 0 2px var(--sun)}
.group.lit .g-sum,.scene.sums .g-sum{opacity:1}
.scene.size-lg{font-size:1.45rem}
.scene.size-md{font-size:1.1rem}
.scene.size-sm{font-size:.84rem;gap:6px;padding:10px}
.scene.size-sm .group{padding:4px 4px 18px}

/* ---------- learn ---------- */
.learn-eq{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px}
.arrow{width:48px;height:48px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:1.3rem;display:grid;place-items:center}
.arrow:disabled{opacity:.25;box-shadow:none}
.skip{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:4px 0 6px}
.skip button{min-height:40px;border-radius:10px;font-family:var(--f-display);font-weight:700;font-size:1rem;color:var(--muted)}
.skip button.on{background:var(--accent);color:var(--accent-ink)}
.skip-label{text-align:center;color:var(--muted);font-size:.85rem}
.tip{background:var(--sun-soft);border-radius:16px;padding:12px 16px;margin:8px 0;font-size:.98rem;display:grid;gap:6px}
.learn-foot{margin-top:18px}

/* ---------- quiz ---------- */
.hud{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:18px}
.bar{flex:1;position:relative;height:10px;background:var(--soft);border-radius:99px}
.bar .fill{position:absolute;inset-block:0;inset-inline-start:0;width:0;border-radius:99px;background:var(--accent);transition:width .45s cubic-bezier(.3,1.3,.5,1)}
.bar .runner{position:absolute;top:50%;inset-inline-start:0;transform:translate(40%,-58%);font-size:1.3rem;transition:inset-inline-start .45s cubic-bezier(.3,1.3,.5,1)}
.bar .barn{position:absolute;inset-inline-end:-4px;top:50%;transform:translateY(-58%);font-size:1.25rem}
.qcount{font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:.95rem;white-space:nowrap}
.timer{width:30px;height:30px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:7}
.timer .bg{stroke:var(--soft)}
.timer .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke .2s}
.stage{position:relative;padding-top:18px}
.float{position:absolute;inset-inline:0;top:-8px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:var(--accent);pointer-events:none;animation:rise 1s ease-out forwards}
.float.bad{color:var(--bad)}
@keyframes rise{from{transform:translateY(8px);opacity:0}25%{opacity:1}to{transform:translateY(-22px);opacity:0}}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.choice{min-height:64px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-family:var(--f-display);font-weight:700;font-size:1.8rem}
.choice.ok{background:var(--accent);color:var(--accent-ink)}
.choice.bad{background:var(--bad-soft);color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:24px}
.pad button{min-height:58px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-family:var(--f-display);font-weight:700;font-size:1.6rem}
.pad button:active{background:var(--soft)}
.pad .del,.pad .hint{background:transparent;box-shadow:none;font-size:1.15rem;color:var(--muted)}
.pad button:disabled{opacity:.35}
.wrong-box{margin-top:16px;text-align:center}

.countdown{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);font-family:var(--f-display);font-weight:800;font-size:6rem;color:var(--accent)}
.countdown span{animation:zoom .7s ease-out both}
@keyframes zoom{from{transform:scale(1.5);opacity:0}30%{opacity:1}to{transform:scale(.95)}}

/* ---------- result ---------- */
.result{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:40px}
.result .r-emoji{font-size:3rem;line-height:1}
.result h2{font-size:clamp(1.6rem,6vw,2rem)}
.bigstars{display:flex;gap:8px;font-size:2.4rem;line-height:1;color:var(--line)}
.bigstars .on{color:var(--sun);animation:starIn .45s both}
@keyframes starIn{from{transform:scale(0)}70%{transform:scale(1.2)}}
.result p{max-width:34ch;color:var(--muted)}
.r-stats{font-family:var(--f-display);font-weight:700;color:var(--ink);font-size:1.05rem}
.r-stats span{color:var(--muted);font-weight:500;font-family:var(--f-body)}
.r-actions{display:grid;gap:4px;width:100%;max-width:320px;margin-top:8px}

/* ---------- mastery grid ---------- */
.grid-wrap{overflow-x:auto;margin:14px 0;padding-bottom:4px}
table.mg{border-collapse:separate;border-spacing:3px;margin:0 auto;font-family:var(--f-display);font-weight:700}
.mg th{width:32px;height:28px;color:var(--muted);font-size:.9rem;font-weight:500}
.mg td{padding:0}
.mg td button{width:32px;height:32px;border-radius:8px;font-size:.82rem;font-weight:700;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.mg .l1 button{background:var(--bad-soft);color:var(--bad)}
.mg .l2 button{background:var(--sun-soft);color:var(--ink)}
.mg .l3 button{background:var(--accent);color:var(--accent-ink)}
.mg-legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:.85rem;color:var(--muted)}
.mg-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-inline-end:5px;background:var(--soft)}
.mg-legend .l1{background:var(--bad)}
.mg-legend .l2{background:var(--sun)}
.mg-legend .l3{background:var(--accent)}
.progress-line{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:14px 0 6px}
.progress-line div{height:100%;background:var(--accent);border-radius:99px}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:1.4rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(400deg)}}

@media (max-width:420px){
  .disc{width:74px;height:74px;font-size:2.1rem}
  .node.champ .disc{width:86px;height:86px}
  .trail{gap:36px}
  .skip{grid-template-columns:repeat(5,1fr)}
  .mg th{width:27px}
  .mg td button{width:28px;height:29px;font-size:.72rem;border-radius:7px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="app" id="app" dir="rtl" lang="ar">

  <!-- ================= HOME ================= -->
  <section id="screen-map">
    <div class="home-top">
      <span class="star-count" title="مجموع النجوم"><b>★</b> <span id="starTotal" class="num">٠</span></span>
      <button class="icon-btn" id="soundBtn" aria-label="تشغيل أو إيقاف الصوت">🔊</button>
    </div>
    <div class="intro">
      <h1>مزرعة جدول الضرب</h1>
      <div class="hello"><span class="hello-sheep" aria-hidden="true">🐑</span><p class="bubble" id="bubble">مرحبًا! أنا صوفي.</p></div>
      <div class="pills">
        <button class="pill" id="reviewBtn">🧠 مراجعة ذكية</button>
        <button class="pill" id="gridBtn">🗺️ خريطة الحفظ</button>
      </div>
    </div>
    <div class="trail" id="trail"></div>
    <p class="goal-flag">أوصل صوفي إلى الكأس 🏆</p>
  </section>

  <!-- ================= LEARN ================= -->
  <section id="screen-learn" hidden>
    <div class="head">
      <button class="icon-btn" data-home aria-label="العودة إلى المزرعة">→</button>
      <h2 id="learnTitle">جدول</h2>
      <button class="icon-btn" id="speakBtn" aria-label="اقرأ بصوت عالٍ">🔈</button>
    </div>
    <div class="learn-eq">
      <button class="arrow" id="prevBtn" aria-label="السابق">→</button>
      <div class="eq" id="learnEq"></div>
      <button class="arrow" id="nextBtn" aria-label="التالي">←</button>
    </div>
    <div class="scene" id="learnScene"></div>
    <p class="sentence" id="learnSentence"></p>
    <div class="row" style="margin:10px 0 18px">
      <button class="link" id="countBtn">👆 عُدّ معي</button>
      <button class="link" id="tipBtn" aria-expanded="false">💡 حيلة للحفظ</button>
    </div>
    <div class="tip" id="tipBox" hidden><p id="tipText"></p><p id="swapText"></p></div>
    <p class="skip-label">نواتج الجدول</p>
    <div class="skip" id="skipRow"></div>
    <div class="learn-foot"><button class="btn block" id="learnToPractice">ابدأ التدريب</button></div>
  </section>

  <!-- ================= QUIZ ================= -->
  <section id="screen-quiz" hidden>
    <div class="hud">
      <button class="icon-btn" id="quitBtn" aria-label="إنهاء والعودة">✕</button>
      <div class="bar" id="energy"><div class="fill" id="energyFill"></div><span class="runner" id="runner" hidden>🐑</span><span class="barn" id="barn" hidden>🏡</span></div>
      <span class="qcount" id="qcount"></span>
      <div class="timer" id="timer" hidden aria-hidden="true">
        <svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle class="fg" id="timerFg" cx="20" cy="20" r="16"/></svg>
      </div>
    </div>
    <div class="stage" id="quizCard">
      <h2 id="quizTitle" hidden></h2>
      <div class="eq" id="quizEq"></div>
      <div class="scene" id="quizScene"></div>
      <p class="sentence" id="quizSentence" hidden></p>
      <div class="choices" id="choices" hidden></div>
      <div class="pad" id="pad" hidden></div>
      <div class="wrong-box" id="wrongBox" hidden><button class="btn" id="wrongNext">فهمت، التالي</button></div>
    </div>
  </section>

  <!-- ================= RESULT ================= -->
  <section id="screen-result" hidden>
    <div class="result" id="result"></div>
  </section>

  <!-- ================= MASTERY GRID ================= -->
  <section id="screen-grid" hidden>
    <div class="head">
      <button class="icon-btn" data-home aria-label="العودة إلى المزرعة">→</button>
      <h2>خريطة الحفظ</h2>
    </div>
    <p class="num" id="mgPct" style="font-weight:700;font-size:1.2rem"></p>
    <div class="progress-line"><div id="mgBar" style="width:0"></div></div>
    <p style="color:var(--muted);font-size:.92rem">اضغط أي مربع لترى صورته.</p>
    <div class="grid-wrap"><table class="mg" id="mg"></table></div>
    <div class="mg-legend"><span><i class="l1"></i>تحتاج مراجعة</span><span><i class="l2"></i>قيد الحفظ</span><span><i class="l3"></i>محفوظة</span></div>
  </section>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
/* ================= data ================= */
const AR = '٠١٢٣٤٥٦٧٨٩';
const ar = n => String(n).replace(/\d/g, d => AR[d]);
// signed points kept in one left-to-right run so the sign stays next to its digits in RTL text
const sgn = n => '⁦' + (n < 0 ? '−' : '+') + ar(Math.abs(n)) + '⁩';
const $ = id => document.getElementById(id);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';

// Each table n is drawn as n "parents", each holding k "children" (n × k).
// [singular, dual, plural], gender (for "واحد/واحدة"), relation word.
const THEMES = {
  1:  {name:'التفاح',    pe:'🧺', ce:'🍎', p:['سلة','سلتان','سلال'],       pg:'f', rel:'في كل',  c:['تفاحة','تفاحتان','تفاحات'],               cg:'f'},
  2:  {name:'الكتاكيت',  pe:'🐔', ce:'🐤', p:['دجاجة','دجاجتان','دجاجات'],   pg:'f', rel:'مع كل',  c:['كتكوت','كتكوتان','كتاكيت'],              cg:'m'},
  3:  {name:'البرتقال',  pe:'🌳', ce:'🍊', p:['شجرة','شجرتان','أشجار'],      pg:'f', rel:'على كل', c:['برتقالة','برتقالتان','برتقالات'],         cg:'f'},
  4:  {name:'النحل',     pe:'🌻', ce:'🐝', p:['زهرة','زهرتان','زهرات'],      pg:'f', rel:'على كل', c:['نحلة','نحلتان','نحلات'],                  cg:'f'},
  5:  {name:'الحافلات',  pe:'🚌', ce:'🧒', p:['حافلة','حافلتان','حافلات'],   pg:'f', rel:'في كل',  c:['طفل','طفلان','أطفال'],                    cg:'m'},
  6:  {name:'السمك',     pe:'⛵', ce:'🐟', p:['قارب','قاربان','قوارب'],      pg:'m', rel:'في كل',  c:['سمكة','سمكتان','سمكات'],                  cg:'f'},
  7:  {name:'الكرات',    pe:'📦', ce:'⚽', p:['صندوق','صندوقان','صناديق'],   pg:'m', rel:'في كل',  c:['كرة','كرتان','كرات'],                     cg:'f'},
  8:  {name:'الخراف',    pe:'🐏', ce:'🐑', p:['خروف','خروفان','خراف'],       pg:'m', rel:'مع كل',  c:['خروف صغير','خروفان صغيران','خراف صغيرة'], cg:'m'},
  9:  {name:'البط',      pe:'🦆', ce:'🐥', p:['بطة','بطتان','بطات'],         pg:'f', rel:'مع كل',  c:['فرخ','فرخان','فراخ'],                     cg:'m'},
  10: {name:'القطط',     pe:'🏠', ce:'🐱', p:['بيت','بيتان','بيوت'],         pg:'m', rel:'في كل',  c:['قطة','قطتان','قطط'],                      cg:'f'},
};
const TIPS = {
  1: 'أي عدد مضروب في ١ يبقى كما هو: ١ × ٧ = ٧.',
  2: 'الضرب في ٢ يعني مضاعفة العدد: ٢ × ٨ هو ٨ + ٨ = ١٦.',
  3: 'عُدّ قفزًا بثلاث: ٣، ٦، ٩، ١٢، ١٥... وكل ثلاث قفزات تزيد ٩.',
  4: 'الضرب في ٤ = ضاعف مرتين: ٤ × ٧ ← ٧ ثم ١٤ ثم ٢٨.',
  5: 'ناتج الضرب في ٥ ينتهي دائمًا بـ ٥ أو ٠، وهو نصف الضرب في ١٠: ٥ × ٨ = نصف ٨٠ = ٤٠.',
  6: 'عندما تضرب ٦ في عدد زوجي يتكرر العدد في الآحاد: ٦ × ٤ = ٢٤، ٦ × ٦ = ٣٦، ٦ × ٨ = ٤٨.',
  7: 'تذكّر ٥٦ = ٧ × ٨ بالترتيب ٥، ٦، ٧، ٨. وفكّر في ٧ × ٧ كأنها ٧ × ٥ ثم ٧ × ٢: ٣٥ + ١٤ = ٤٩.',
  8: 'الضرب في ٨ = ضاعف ثلاث مرات: ٨ × ٦ ← ١٢ ← ٢٤ ← ٤٨.',
  9: 'رقما الناتج مجموعهما ٩، والعشرات أقل من العدد بواحد: ٩ × ٧ ← عشرات ٦ وآحاد ٣ = ٦٣.',
  10: 'أضف صفرًا في خانة الآحاد: ١٠ × ٧ = ٧٠.',
};
// The order tip always uses a fact from the table being studied (e.g. table 2 → ٢ × ٦ = ٦ × ٢).
function swapTip(n){
  const k = n <= 5 ? n + 4 : n - 4;
  return `وتذكّر أن الترتيب لا يغيّر الناتج: ${ar(n)} × ${ar(k)} هو نفسه ${ar(k)} × ${ar(n)}، وكلاهما ${ar(n * k)}. كل حقيقة تحفظها تعطيك حقيقتين!`;
}

// Challenge rules: faster answers fill the energy bar faster, so a child who knows the table finishes in fewer questions.
const SPEED = [
  {max:3,  pts:20, label:'⚡ صاعقة!',  rule:'أقل من ٣ ثوانٍ'},
  {max:5,  pts:15, label:'🚀 سريع!',   rule:'أقل من ٥ ثوانٍ'},
  {max:8,  pts:10, label:'👍 صحيح',    rule:'أقل من ٨ ثوانٍ'},
  {max:1e9,pts:6,  label:'🐢 صحيح',    rule:'أبطأ من ذلك'},
];
const WRONG_PENALTY = 8, HINT_PTS = 6;
const LEVEL_CFG = n => n === 11
  ? {goal:160, maxQ:26, s3:11, s2:15}
  : {goal:100, maxQ:18, s3:7,  s2:10};

/* ================= state ================= */
const KEY = 'multiplication-farm-v1';
const fresh = () => ({stars:{}, best:{}, facts:{}, sheep:0, sound:true});
let S = fresh();
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.facts) S = Object.assign(fresh(), s); } catch(e){} }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

const stars = n => S.stars[n] || 0;
const unlocked = n => n === 1 || stars(n) > 0 || (n === 11 ? [...Array(10)].every((_, i) => stars(i + 1) > 0) : stars(n - 1) > 0);
const theme = a => THEMES[a] || THEMES[8];

function record(a, b, ok, t){
  const k = a + 'x' + b, f = S.facts[k] || (S.facts[k] = {c:0, w:0, s:0, t:[]});
  if (ok){ f.c++; f.s++; f.t.push(Math.round(t * 10) / 10); if (f.t.length > 3) f.t.shift(); S.sheep++; }
  else { f.w++; f.s = 0; f.t = []; }
}
function level(a, b){
  const f = S.facts[a + 'x' + b];
  if (!f) return 0;
  if (f.s === 0) return 1;
  const avg = f.t.reduce((x, y) => x + y, 0) / f.t.length;
  return f.s >= 3 && avg <= 5 ? 3 : 2;
}
function weakness(a, b){ // higher = needs more practice
  const f = S.facts[a + 'x' + b];
  if (!f) return 2.5;
  const avg = f.t.length ? f.t.reduce((x, y) => x + y, 0) / f.t.length : 9;
  return (f.s === 0 ? 4 : 0) + f.w / (f.c + f.w + 1) * 3 + Math.min(avg, 10) / 5 - Math.min(f.s, 4) * .5;
}

/* ================= language helpers ================= */
function countPhrase(n, forms, g){
  if (n === 1) return forms[0] + (g === 'f' ? ' واحدة' : ' واحد');
  if (n === 2) return forms[1];
  return ar(n) + ' ' + forms[2];
}
function sentence(a, b){
  const th = theme(a);
  return `${countPhrase(a, th.p, th.pg)}، ${th.rel} ${th.p[0]} ${countPhrase(b, th.c, th.cg)}`;
}

/* ================= sound ================= */
let AC = null;
function beep(notes, type = 'triangle', len = .11){
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime;
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0 + i * len);
      g.gain.exponentialRampToValueAtTime(.14, t0 + i * len + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + i * len + len * 1.6);
      o.connect(g).connect(AC.destination); o.start(t0 + i * len); o.stop(t0 + i * len + len * 1.8);
    });
  } catch(e){}
}
const SND = {
  ok: () => beep([660, 880]),
  zap: () => beep([660, 880, 1175], 'triangle', .07),
  bad: () => beep([260, 220], 'sine', .14),
  tick: () => beep([520], 'sine', .05),
  win: () => beep([523, 659, 784, 1047], 'triangle', .13),
};

/* ================= navigation ================= */
const SCREENS = ['map', 'learn', 'quiz', 'result', 'grid'];
function show(name){
  SCREENS.forEach(s => $('screen-' + s).hidden = s !== name);
  window.scrollTo({top:0});
  if (name === 'map') renderMap();
}
document.querySelectorAll('[data-home]').forEach(b => b.onclick = () => show('map'));

/* ================= picture renderer ================= */
function renderScene(el, a, b){
  const th = theme(a), total = a * b;
  el.hidden = false;
  el.className = 'scene size-' + (total <= 20 ? 'lg' : total <= 50 ? 'md' : 'sm');
  el.innerHTML = '';
  const cols = Math.min(b, 5);
  for (let i = 0; i < a; i++){
    const g = document.createElement('div');
    g.className = 'group';
    g.style.setProperty('--d', Math.min(i * 40, 360) + 'ms');
    g.innerHTML = `<div class="g-head">${th.pe}</div><div class="g-items" style="--cols:${cols}">${('<span>' + th.ce + '</span>').repeat(b)}</div><div class="g-sum">${ar(b * (i + 1))}</div>`;
    el.appendChild(g);
  }
  el.setAttribute('aria-label', `${sentence(a, b)}، المجموع ${ar(total)}`);
}
let countRun = 0;
async function countAlong(el, fast){
  const run = ++countRun, groups = [...el.querySelectorAll('.group')];
  el.classList.remove('sums');
  groups.forEach(g => g.classList.remove('lit'));
  const step = fast ? 160 : Math.max(260, 520 - groups.length * 20);
  for (const g of groups){
    if (run !== countRun) return;
    g.classList.add('lit'); SND.tick();
    await new Promise(r => setTimeout(r, step));
  }
  if (run === countRun) el.classList.add('sums');
}

/* ================= home: winding trail ================= */
const OFFS = [0, .9, 1.3, .9, 0, -.9, -1.3, -.9, 0, .9, 0];
const DECOS = ['🌳', '🌼', '🍄', '🌷', '🌲', '🦋', '🌻', '🐞', '🌸', '🌾', '🎈'];
let currentNode = 0;
function renderMap(){
  $('starTotal').textContent = ar(Object.values(S.stars).reduce((x, y) => x + y, 0)) + ' من ' + ar(33);
  $('soundBtn').textContent = S.sound ? '🔊' : '🔇';
  currentNode = 0;
  for (let n = 1; n <= 11; n++) if (unlocked(n) && !stars(n)) { currentNode = n; break; }
  const total = Object.values(S.stars).reduce((x, y) => x + y, 0);
  $('bubble').textContent = currentNode === 0 ? 'أنت بطل المزرعة! جرّب أن تجمع كل النجوم ⭐'
    : currentNode === 11 ? 'وصلنا إلى الكأس! هل أنت جاهز لتحدي البطل؟ 🏆'
    : total === 0 ? `مرحبًا! أنا صوفي 🐑 هيا نبدأ بجدول ${ar(currentNode)}. اضغط على الدائرة التي أقف عندها.`
    : `أحسنت! هيا إلى جدول ${ar(currentNode)}. كلما أجبت أسرع وصلنا أسرع!`;
  const trail = $('trail');
  trail.innerHTML = '<svg class="trail-svg" aria-hidden="true"><path class="road" id="road"/><path class="road-line" id="roadLine"/><path class="road-done" id="roadDone"/></svg>';
  for (let n = 1; n <= 11; n++){
    const champ = n === 11, lock = !unlocked(n), st = stars(n);
    const name = champ ? 'تحدي البطل' : 'جدول ' + ar(n);
    const btn = document.createElement('button');
    btn.className = 'node' + (lock ? ' locked' : '') + (n === currentNode ? ' current' : '') + (champ ? ' champ' : '');
    btn.style.setProperty('--x', OFFS[n - 1]);
    btn.innerHTML = `
      <span class="disc"><span class="em">${champ ? '🏆' : theme(n).pe}</span>${champ ? '' : `<span class="badge num">${lock ? '🔒' : ar(n)}</span>`}${n === currentNode ? `<span class="mascot ${OFFS[n - 1] > 0 ? 'on-left' : 'on-right'}" aria-hidden="true">🐑</span>` : ''}</span>
      ${champ ? `<span class="n-label">${name}</span>` : ''}
      ${lock && !champ ? '' : `<span class="n-stars" aria-hidden="true">${[1, 2, 3].map(i => `<span class="${i <= st ? 'on' : ''}">★</span>`).join('')}</span>`}`;
    btn.setAttribute('aria-label', name + (lock ? '، مقفل' : '') + '، ' + ar(st) + ' من ٣ نجوم');
    btn.onclick = () => openSheet(n);
    trail.appendChild(btn);
  }
  DECOS.forEach((d, i) => { const e = document.createElement('span'); e.className = 'deco'; e.dataset.i = i; e.textContent = d; trail.appendChild(e); });
  requestAnimationFrame(() => {
    drawTrail();
    if (currentNode >= 4){
      const el = trail.querySelectorAll('.node')[currentNode - 1];
      el && el.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
    }
  });
}
function drawTrail(){
  const trail = $('trail'), road = $('road');
  if (!road || $('screen-map').hidden) return;
  const r0 = trail.getBoundingClientRect(), W = r0.width;
  const pts = [...trail.querySelectorAll('.disc')].map(d => { const r = d.getBoundingClientRect(); return [r.left + r.width / 2 - r0.left, r.top + r.height / 2 - r0.top]; });
  const curve = list => list.reduce((d, [x1, y1], i) => {
    if (!i) return `M${x1},${y1}`;
    const [x0, y0] = list[i - 1], m = (y1 - y0) / 2;
    return d + ` C${x0},${y0 + m} ${x1},${y1 - m} ${x1},${y1}`;
  }, '');
  const full = curve(pts);
  road.setAttribute('d', full); $('roadLine').setAttribute('d', full);
  const reach = currentNode === 0 ? pts.length : currentNode;
  $('roadDone').setAttribute('d', reach > 1 ? curve(pts.slice(0, reach)) : '');
  // scenery on the open side of each bend
  trail.querySelectorAll('.deco').forEach(e => {
    const i = +e.dataset.i, [x, y] = pts[i];
    const side = OFFS[i] > 0 ? -1 : OFFS[i] < 0 ? 1 : (i % 4 === 0 ? 1 : -1);
    const gap = Math.min(130, W * .32);
    e.style.left = Math.max(22, Math.min(W - 22, x + side * gap)) + 'px';
    e.style.top = (y + (i % 2 ? 16 : -8)) + 'px';
  });
}
addEventListener('resize', () => requestAnimationFrame(drawTrail));

/* ================= sheet ================= */
function openSheet(n){
  const champ = n === 11, lock = !unlocked(n), th = theme(n), best = S.best[n], cfg = LEVEL_CFG(n);
  const starLine = stars(n) ? `<span style="color:var(--sun)">${'★'.repeat(stars(n))}</span>` + (best ? ` · أفضل رقم ${ar(best.q)} أسئلة` : '') : 'لم تبدأ بعد';
  const head = champ
    ? `<span class="big">🏆</span><div><h2>تحدي البطل</h2><p>${starLine}</p></div>`
    : `<span class="big">${th.pe}</span><div><h2>جدول ${ar(n)}</h2><p>${starLine}</p></div>`;
  let body = '';
  if (lock){
    body += champ
      ? `<div class="locked-note">🔒 احصل على نجمة واحدة على الأقل في كل جدول ليُفتح هذا التحدي.</div>`
      : `<div class="locked-note">🔒 أكمل جدول ${ar(n - 1)} أولًا. وإن كنت تحفظ هذا الجدول، اقفز إليه باختبار التحدي.</div>`;
  }
  body += '<div class="acts">';
  if (!champ){
    body += `<button class="act" data-act="learn"><span class="ai">📖</span><span><b>تعلّم</b><small>الجدول بالصور</small></span></button>`;
    body += `<button class="act" data-act="practice"><span class="ai">🎯</span><span><b>تدرّب</b><small>١٠ أسئلة مع الصور، بلا وقت</small></span></button>`;
  }
  if (!(champ && lock)){
    body += `<button class="act primary" data-act="challenge"><span class="ai">⚡</span><span><b>${lock ? 'اختبار القفز' : 'التحدي'}</b><small>أوصل الخروف إلى الحظيرة</small></span></button>`;
  }
  body += '</div>';
  body += `<p class="note">في التحدي، الإجابة الأسرع تملأ الشريط أسرع، فتنهي المرحلة بأسئلة أقل.</p>
    <details><summary>كيف تُحسب النقاط والنجوم؟</summary>
      <div class="rules">${SPEED.map(s => `<span>${s.rule}</span><b class="num">${sgn(s.pts)}</b>`).join('')}
        <span>إجابة خاطئة</span><b class="num">${sgn(-WRONG_PENALTY)}</b>
        <span>بمساعدة الصورة</span><b class="num">${sgn(HINT_PTS)}</b></div>
      <p style="margin-top:8px">يكتمل الشريط عند ${ar(cfg.goal)} نقطة. ٣ نجوم: ${ar(cfg.s3)} أسئلة أو أقل بلا أخطاء. نجمتان: ${ar(cfg.s2)} أسئلة أو أقل.</p>
    </details>`;
  $('sheet').innerHTML = `<div class="s-head">${head}<button class="icon-btn" data-close aria-label="إغلاق">✕</button></div>${body}`;
  $('sheet').querySelector('[data-close]').onclick = closeSheet;
  $('sheet').querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    closeSheet();
    const a = b.dataset.act;
    if (a === 'learn') openLearn(n, 1);
    if (a === 'practice') startPractice(n);
    if (a === 'challenge') startChallenge(n);
  });
  $('overlay').hidden = false;
  $('sheet').querySelector('[data-act]')?.focus();
}
function closeSheet(){ $('overlay').hidden = true; }
$('overlay').onclick = e => { if (e.target === $('overlay')) closeSheet(); };
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('overlay').hidden) closeSheet(); });

/* ================= learn ================= */
const L = {n:1, k:1};
function openLearn(n, k){ L.n = n; L.k = k; $('tipBox').hidden = true; $('tipBtn').setAttribute('aria-expanded', 'false'); show('learn'); renderLearn(); }
function renderLearn(){
  const {n, k} = L, th = theme(n);
  $('learnTitle').textContent = `جدول ${ar(n)} · ${th.name}`;
  $('learnEq').innerHTML = `<span>${ar(n)}</span><span class="op">×</span><span>${ar(k)}</span><span class="op">=</span><span class="ans ok">${ar(n * k)}</span>`;
  $('learnSentence').textContent = `${sentence(n, k)}، والمجموع ${ar(n * k)}`;
  renderScene($('learnScene'), n, k);
  $('skipRow').innerHTML = [...Array(10)].map((_, i) => `<button class="${i + 1 === k ? 'on' : ''}" data-k="${i + 1}" aria-label="${ar(n)} × ${ar(i + 1)} = ${ar(n * (i + 1))}">${ar(n * (i + 1))}</button>`).join('');
  $('skipRow').querySelectorAll('button').forEach(b => b.onclick = () => { L.k = +b.dataset.k; renderLearn(); });
  $('tipText').textContent = TIPS[n] || '';
  $('swapText').textContent = swapTip(n);
  $('prevBtn').disabled = k === 1;
  $('nextBtn').disabled = k === 10;
}
$('prevBtn').onclick = () => { if (L.k > 1){ L.k--; renderLearn(); } };
$('nextBtn').onclick = () => { if (L.k < 10){ L.k++; renderLearn(); } };
$('countBtn').onclick = () => countAlong($('learnScene'));
$('tipBtn').onclick = () => { const h = !$('tipBox').hidden; $('tipBox').hidden = h; $('tipBtn').setAttribute('aria-expanded', String(!h)); };
$('learnToPractice').onclick = () => startPractice(L.n);
if (!('speechSynthesis' in window)) $('speakBtn').hidden = true;
$('speakBtn').onclick = () => {
  try {
    const u = new SpeechSynthesisUtterance(`${L.n} في ${L.k} يساوي ${L.n * L.k}`);
    u.lang = 'ar-SA'; u.rate = .85;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ar'));
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch(e){}
};

/* ================= quiz engine ================= */
let Q = null, rafId = 0;
function tableFacts(n){ return [...Array(10)].map((_, i) => [n, i + 1]); }

function startPractice(n){
  startQuiz({mode:'practice', n, title:`تدريب جدول ${ar(n)}`, input:'choices', showPic:true, total:10, queue:shuffle(tableFacts(n))});
}
function weightedDeck(facts){
  // shuffle, then let weaker facts drift to the front
  return shuffle(facts.slice()).map(f => [f, weakness(...f) + Math.random() * 2]).sort((x, y) => y[1] - x[1]).map(x => x[0]);
}
function startChallenge(n){
  const pool = n === 11 ? [].concat(...[2, 3, 4, 5, 6, 7, 8, 9].map(a => [...Array(8)].map((_, i) => [a, i + 2]))) : tableFacts(n);
  startQuiz({mode:'challenge', n, title: n === 11 ? 'تحدي البطل' : `تحدي جدول ${ar(n)}`, input:'pad', showPic:false, pool, queue:weightedDeck(pool), ...LEVEL_CFG(n)}, true);
}
function startReview(){
  let pool = [];
  for (let a = 1; a <= 10; a++) if (unlocked(a)) pool.push(...tableFacts(a));
  const seen = pool.filter(([a, b]) => S.facts[a + 'x' + b]);
  const base = seen.length >= 10 ? seen : pool;
  const queue = base.map(f => [f, weakness(...f) + Math.random()]).sort((x, y) => y[1] - x[1]).slice(0, 10).map(x => x[0]);
  startQuiz({mode:'review', title:'مراجعة ذكية', input:'pad', showPic:false, total:10, queue:shuffle(queue)});
}

function startQuiz(cfg, countdown){
  Q = Object.assign({asked:0, correct:0, wrong:0, energy:0, times:[], combo:0, zaps:0, typed:'', busy:true, hinted:false, missed:[]}, cfg);
  show('quiz');
  $('quizTitle').textContent = cfg.title;
  $('runner').hidden = $('barn').hidden = cfg.mode !== 'challenge';
  $('timer').hidden = cfg.mode === 'practice';
  $('choices').hidden = cfg.input !== 'choices';
  $('pad').hidden = cfg.input !== 'pad';
  if (cfg.input === 'pad') buildPad();
  updateHud();
  if (countdown) runCountdown(nextQuestion); else nextQuestion();
}
function runCountdown(done){
  const el = document.createElement('div'); el.className = 'countdown'; document.body.appendChild(el);
  const seq = ['٣', '٢', '١', 'انطلق'];
  let i = 0;
  const step = () => {
    if (i >= seq.length){ el.remove(); done(); return; }
    el.innerHTML = `<span style="${i === 3 ? 'font-size:3.5rem' : ''}">${seq[i]}</span>`;
    i < 3 ? SND.tick() : SND.ok();
    i++; setTimeout(step, i === 4 ? 500 : 650);
  };
  step();
}
function buildPad(){
  const keys = ['١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩', 'hint', '٠', 'del'];
  $('pad').innerHTML = keys.map(k => k === 'del' ? '<button class="del" data-k="del" aria-label="حذف">⌫ حذف</button>'
    : k === 'hint' ? `<button class="hint" data-k="hint" aria-label="أرني الصورة">💡 الصورة</button>` : `<button data-k="${AR.indexOf(k)}">${k}</button>`).join('');
  $('pad').querySelectorAll('button').forEach(b => b.onclick = () => padKey(b.dataset.k));
}
function updateHud(){
  if (!Q) return;
  let pct;
  if (Q.mode === 'challenge'){
    pct = Math.min(100, Q.energy / Q.goal * 100);
    $('runner').style.insetInlineStart = `calc(${pct * .9}%)`;
    $('qcount').textContent = `${ar(Q.asked)} من ${ar(Q.maxQ)}`;
    $('qcount').title = 'عدد الأسئلة المستخدمة من الحد الأقصى';
  } else {
    pct = Q.asked / Q.total * 100;
    $('qcount').textContent = `${ar(Math.min(Q.asked + 1, Q.total))} من ${ar(Q.total)}`;
    $('qcount').title = '';
  }
  $('energyFill').style.width = pct + '%';
}

function nextQuestion(){
  if (!Q) return;
  if (Q.mode === 'challenge'){
    if (Q.energy >= Q.goal || Q.asked >= Q.maxQ) return finish();
    if (!Q.queue.length) Q.queue = weightedDeck(Q.pool);
  } else if (Q.asked >= Q.total) return finish();
  const [a, b] = Q.cur = Q.queue.shift();
  Q.typed = ''; Q.busy = false; Q.hinted = false;
  $('quizEq').innerHTML = `<span>${ar(a)}</span><span class="op">×</span><span>${ar(b)}</span><span class="op">=</span><span class="ans" id="ans">؟</span>`;
  $('quizSentence').hidden = true;
  $('wrongBox').hidden = true;
  if (Q.showPic){ renderScene($('quizScene'), a, b); $('quizSentence').hidden = false; $('quizSentence').textContent = sentence(a, b); }
  else { $('quizScene').hidden = true; $('quizScene').innerHTML = ''; }
  if (Q.input === 'choices') renderChoices(a, b);
  else { $('pad').hidden = false; $('pad').querySelectorAll('button').forEach(x => x.disabled = false); }
  updateHud();
  Q.t0 = performance.now();
  if (Q.mode !== 'practice') tickTimer();
}
function tickTimer(){
  cancelAnimationFrame(rafId);
  const C = 2 * Math.PI * 16, fg = $('timerFg');
  fg.style.strokeDasharray = C;
  const loop = () => {
    if (!Q || Q.busy) return;
    const t = (performance.now() - Q.t0) / 1000, frac = Math.max(0, 1 - t / 8);
    fg.style.strokeDashoffset = C * (1 - frac);
    fg.style.stroke = t <= 3 ? 'var(--accent)' : t <= 8 ? 'var(--sun)' : 'var(--bad)';
    rafId = requestAnimationFrame(loop);
  };
  loop();
}
function renderChoices(a, b){
  const ans = a * b, set = new Set([ans]);
  const cands = shuffle([a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, ans + 10, ans - 10, ans + 1, ans - 1, a + b, ans + a, ans - a]);
  for (const c of cands){ if (set.size >= 4) break; if (c > 0 && c <= 120) set.add(c); }
  while (set.size < 4) set.add(ans + set.size * 2 + 1);
  const opts = shuffle([...set]);
  $('choices').innerHTML = opts.map(v => `<button class="choice num" data-v="${v}">${ar(v)}</button>`).join('');
  $('choices').querySelectorAll('button').forEach(btn => btn.onclick = () => answer(+btn.dataset.v, btn));
}
function padKey(k){
  if (!Q || Q.busy || Q.input !== 'pad') return;
  if (k === 'hint'){ showHint(); return; }
  if (k === 'del'){ Q.typed = Q.typed.slice(0, -1); }
  else if (Q.typed.length < 3){ Q.typed += k; }
  const [a, b] = Q.cur, want = String(a * b);
  $('ans').textContent = Q.typed ? ar(Q.typed) : '؟';
  if (Q.typed.length >= want.length && k !== 'del') answer(+Q.typed);
}
function showHint(){
  if (Q.hinted) return;
  Q.hinted = true;
  const [a, b] = Q.cur;
  renderScene($('quizScene'), a, b);
  countAlong($('quizScene'), true);
}
addEventListener('keydown', e => {
  if (!Q || $('screen-quiz').hidden) return;
  if (!$('wrongBox').hidden && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); $('wrongNext').click(); return; }
  if (Q.input !== 'pad') { if (/^[1-4]$/.test(e.key)) $('choices').children[+e.key - 1]?.click(); return; }
  let d = e.key;
  const i = AR.indexOf(d); if (i >= 0) d = String(i);
  if (/^\d$/.test(d)) padKey(d);
  else if (e.key === 'Backspace') padKey('del');
  else if (e.key === 'h' || e.key === '?') padKey('hint');
});

function floatMsg(txt, bad){
  const f = document.createElement('div'); f.className = 'float' + (bad ? ' bad' : ''); f.textContent = txt;
  $('quizCard').appendChild(f); setTimeout(() => f.remove(), 1000);
}
function answer(v, btn){
  if (Q.busy) return;
  Q.busy = true; cancelAnimationFrame(rafId);
  const [a, b] = Q.cur, ans = a * b, ok = v === ans;
  const t = (performance.now() - Q.t0) / 1000;
  Q.asked++;
  record(a, b, ok, Q.hinted ? 9 : t);
  const ansEl = $('ans');
  if (ok){
    Q.correct++; Q.times.push(t); Q.combo++;
    ansEl.textContent = ar(ans); ansEl.classList.add('ok');
    if (btn) btn.classList.add('ok');
    let delay = 600;
    if (Q.mode === 'challenge'){
      const sp = Q.hinted ? {pts:HINT_PTS, label:'💡 صحيح'} : SPEED.find(s => t <= s.max);
      if (!Q.hinted && sp.pts === SPEED[0].pts) Q.zaps++;
      Q.energy += sp.pts;
      floatMsg(`${sp.label} ${sgn(sp.pts)}${Q.combo >= 3 ? ' · 🔥' + ar(Q.combo) : ''}`);
      sp.pts >= 20 ? SND.zap() : SND.ok();
    } else {
      floatMsg(t <= 3 ? '⚡ صاعقة!' : 'أحسنت!');
      SND.ok();
      if (Q.mode === 'practice'){ $('quizScene').classList.add('sums'); delay = 850; }
    }
    updateHud();
    setTimeout(nextQuestion, delay);
  } else {
    Q.wrong++; Q.combo = 0; Q.missed.push([a, b]);
    SND.bad();
    if (btn){ btn.classList.add('bad'); $('choices').querySelector(`[data-v="${ans}"]`)?.classList.add('ok'); }
    ansEl.textContent = ar(ans); ansEl.classList.add('bad');
    if (Q.mode === 'challenge'){
      Q.energy = Math.max(0, Q.energy - WRONG_PENALTY);
      Q.queue.splice(2, 0, [a, b]); // ask it again soon
    }
    updateHud();
    // learning moment: replace the keypad with the picture and the correct answer
    renderScene($('quizScene'), a, b);
    $('quizSentence').hidden = false; $('quizSentence').textContent = `${sentence(a, b)}، والمجموع ${ar(ans)}`;
    countAlong($('quizScene'), true);
    if (Q.input === 'pad') $('pad').hidden = true;
    $('wrongBox').hidden = false; $('wrongNext').focus();
  }
  save();
}
$('wrongNext').onclick = () => nextQuestion();
$('quitBtn').onclick = () => { cancelAnimationFrame(rafId); Q = null; show('map'); };

/* ================= result ================= */
function finish(){
  cancelAnimationFrame(rafId);
  const q = Q; Q = null;
  const avg = q.times.length ? q.times.reduce((x, y) => x + y, 0) / q.times.length : 0;
  const fmt = s => ar(s.toFixed(1)).replace('.', '٫') + ' ث';
  let html = '', win = true, earned = 0;
  const actions = [];
  if (q.mode === 'challenge'){
    win = q.energy >= q.goal;
    if (win){
      earned = q.asked <= q.s3 && q.wrong === 0 ? 3 : q.asked <= q.s2 ? 2 : 1;
      S.stars[q.n] = Math.max(stars(q.n), earned);
      if (!S.best[q.n] || q.asked < S.best[q.n].q) S.best[q.n] = {q:q.asked, avg:+avg.toFixed(1)};
    }
    const msgs = {3:'وصلت إلى الحظيرة بسرعة الصاعقة.', 2:'أجب أسرع قليلًا لتنال النجمة الثالثة.', 1:'كلما تدرّبت صرت أسرع ووصلت بأسئلة أقل.'};
    const name = q.n === 11 ? 'تحدي البطل' : 'جدول ' + ar(q.n);
    html += `<div class="r-emoji">${win ? '🏡' : '🐑'}</div><h2>${win ? 'أحسنت! تجاوزت ' + name : 'اقتربت كثيرًا!'}</h2>`;
    if (win) html += `<div class="bigstars" aria-label="${ar(earned)} من ٣ نجوم">${[1, 2, 3].map(i => `<span class="${i <= earned ? 'on' : ''}" style="animation-delay:${i * 160}ms">★</span>`).join('')}</div>`;
    html += `<p>${win ? msgs[earned] : 'انتهت الأسئلة قبل أن يمتلئ الشريط. راجع الجدول بالصور ثم حاول مجددًا.'}</p>`;
    html += `<div class="r-stats">${ar(q.asked)} <span>أسئلة</span> · ${q.times.length ? fmt(avg) : '—'} <span>متوسط الإجابة</span>${q.wrong ? ` · ${ar(q.wrong)} <span>أخطاء</span>` : ''}</div>`;
    if (win && q.n < 10) actions.push(['next', 'الجدول التالي', true]);
    else if (win && q.n === 10 && unlocked(11)) actions.push(['champ', '🏆 تحدي البطل', true]);
    else if (!win && q.n !== 11) actions.push(['learn', 'راجع الجدول', true]);
    actions.push(['retry', win && earned < 3 ? 'حاول لـ ٣ نجوم' : 'أعد المحاولة', !actions.length]);
  } else {
    const pct = q.correct / q.total;
    html += `<div class="r-emoji">${pct === 1 ? '🏅' : pct >= .7 ? '🌟' : '🌱'}</div>`;
    html += `<h2>${ar(q.correct)} من ${ar(q.total)} صحيحة</h2>`;
    if (q.missed.length) html += `<p>راجع: ${q.missed.map(([a, b]) => `<b class="num" style="white-space:nowrap;color:var(--ink)">${ar(a)} × ${ar(b)} = ${ar(a * b)}</b>`).join('، ')}</p>`;
    else html += `<p>${q.mode === 'practice' ? 'كل الإجابات صحيحة. أنت جاهز للتحدي!' : 'ممتاز! كل الحقائق صحيحة.'}</p>`;
    if (q.mode === 'practice'){ actions.push(['challenge', unlocked(q.n) ? 'ابدأ التحدي' : 'اختبار القفز', true]); actions.push(['retry', 'تدرّب مجددًا']); }
    else actions.push(['retry', 'مراجعة أخرى', true]);
  }
  actions.push(['map', 'العودة إلى المزرعة']);
  html += `<div class="r-actions">${actions.map(([r, label, primary]) => `<button class="${primary ? 'btn block' : 'link'}" data-r="${r}">${label}</button>`).join('')}</div>`;
  save();
  const box = $('result');
  box.innerHTML = html;
  show('result');
  if (win && (q.mode === 'challenge' || q.correct === q.total)){ SND.win(); confetti(theme(q.n && q.n <= 10 ? q.n : 8)); }
  box.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    const r = b.dataset.r;
    if (r === 'map') show('map');
    if (r === 'next'){ show('map'); openSheet(q.n + 1); }
    if (r === 'champ') startChallenge(11);
    if (r === 'learn') openLearn(q.n, 1);
    if (r === 'challenge') startChallenge(q.n);
    if (r === 'retry') q.mode === 'challenge' ? startChallenge(q.n) : q.mode === 'practice' ? startPractice(q.n) : startReview();
  });
}
function confetti(th){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('div'); c.className = 'confetti';
  const pieces = ['⭐', th.ce, '✨'];
  for (let i = 0; i < 18; i++){
    const p = document.createElement('i');
    p.textContent = pieces[i % pieces.length];
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = 2 + Math.random() * 1.4 + 's';
    p.style.animationDelay = Math.random() * .5 + 's';
    c.appendChild(p);
  }
  document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
}

/* ================= mastery grid ================= */
function renderGrid(){
  let h = '<tr><th class="num">×</th>' + [...Array(10)].map((_, j) => `<th class="num">${ar(j + 1)}</th>`).join('') + '</tr>';
  let mastered = 0;
  for (let a = 1; a <= 10; a++){
    h += `<tr><th class="num">${ar(a)}</th>`;
    for (let b = 1; b <= 10; b++){
      const lv = level(a, b); if (lv === 3) mastered++;
      h += `<td class="l${lv}"><button data-a="${a}" data-b="${b}" aria-label="${ar(a)} × ${ar(b)} = ${ar(a * b)}">${ar(a * b)}</button></td>`;
    }
    h += '</tr>';
  }
  $('mg').innerHTML = h;
  $('mgBar').style.width = mastered + '%';
  $('mgPct').textContent = `حفظت ${ar(mastered)} من ${ar(100)}`;
  $('mg').querySelectorAll('button').forEach(b => b.onclick = () => openLearn(+b.dataset.a, +b.dataset.b));
}

/* ================= wiring ================= */
$('reviewBtn').onclick = startReview;
$('gridBtn').onclick = () => { show('grid'); renderGrid(); };
$('soundBtn').onclick = () => { S.sound = !S.sound; save(); $('soundBtn').textContent = S.sound ? '🔊' : '🔇'; if (S.sound) SND.ok(); };

function start(data){
  load();
  if (data && data.S) S = Object.assign(fresh(), data.S);
  show('map');
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(drawTrail));
}
window.claude?.hot?.snapshot?.(() => ({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
