var MSGS=[], MSGSEQ=0;
/* ── the thread travels with the record ───────────────────────────────
   The board promises that "messages are permanent — an edit keeps its history,
   and the thread exports with the job". It could not: MSGS lived in this file
   and nothing else could see it, so a billing clerk looking at an invoice, or a
   client asking why his parcel waited, had no way to reach what was said about
   it. The diagram could not see it either — a table that publishes nothing is
   invisible to a map drawn from the wires.
   Published per record, because a reader wants one thread, not the company's
   whole correspondence. Text only: who said it, when, to which roles, and
   whether it was edited — never the internal work item behind it. */
var SL_REG_THREADS='SL_THREADS_V1';
function threadRegistry(){
 var by={};
 MSGS.forEach(function(m){
  if(!m.ref)return;
  (by[m.ref]=by[m.ref]||[]).push({
   id:m.id,at:m.at,by:m.by,roles:(m.roles||[]).slice(),
   kind:m.kind||'human',text:m.text||'',
   edited:!!(m.edits&&m.edits.length),
   replyTo:m.replyTo||null});
 });
 var out=[],k;
 for(k in by)if(by.hasOwnProperty(k)){
  by[k].sort(function(a,b){return a.at-b.at;});
  out.push({ref:k,count:by[k].length,last:by[k][by[k].length-1].at,messages:by[k]});
 }
 return out;
}
function slThreadsPublish(){
 try{
  window.localStorage.setItem(SL_REG_THREADS,JSON.stringify({
   at:new Date().getTime(),threads:threadRegistry()}));
  return true;
 }catch(e){return false;}
}
function threadOf(ref){return MSGS.filter(function(m){return m.ref===ref;}).sort(function(a,b){return a.at-b.at;});}
function threadRefs(){
 var seen={},out=[];
 MSGS.forEach(function(m){if(!seen[m.ref]){seen[m.ref]=1;out.push(m.ref);}});
 return out;
}
// who actually reads a role right now — the holder, or the delegate if they are away
function readerOfRole(role,hub){
 var p=null, elsewhere=false;
 if(hub)p=PEOPLE.find(function(x){return x.role===role&&x.hub===hub;});
 if(!p){                                        // nobody holds that role at that hub
  p=PEOPLE.find(function(x){return x.role===role;});
  elsewhere=!!hub&&!!p;
 }
 if(!p)return null;
 if(personOOO(p.id)){
  var dg=personById(p.ooo.delegate);
  if(dg){dg=Object.create?Object.create(dg):dg;}
  var d2=personById(p.ooo.delegate);
  return d2?{id:d2.id,name:d2.name,role:d2.role,hub:d2.hub,viaDelegate:p.name,elsewhere:elsewhere}:null;
 }
 return {id:p.id,name:p.name,role:p.role,hub:p.hub,viaDelegate:null,elsewhere:elsewhere};
}
function roleHasHub(role,hub){return PEOPLE.some(function(x){return x.role===role&&x.hub===hub;});}
function postMessage(o){
 o=o||{};
 var text=String(o.text||'').replace(/\s/g,'').length?o.text:'';
 if(!text)return {ok:false,why:'an empty message says nothing'};
 var ref=o.ref;
 var roles=(o.roles||[]).filter(function(r){return !!roleById(r);});
 // a reply inherits the record and the participants — no re-tagging
 if(o.replyTo){
  var parent=MSGS.find(function(m){return m.id===o.replyTo;});
  if(parent){ref=ref||parent.ref; if(!roles.length)roles=parent.roles.slice(); if(!o.hub)o.hub=parent.hub;}
 }
 if(!ref)return {ok:false,why:'a message must name the shipment or trip it is about'};
 if(!recordExists(ref))return {ok:false,why:'that record does not exist — pick it from the list rather than typing a number nobody knows'};
 if(!roles.length)return {ok:false,why:'a message must be addressed to at least one role'};
 MSGSEQ++;
 var m={id:'MSG-'+MSGSEQ,ref:ref,roles:roles,hub:o.hub||null,person:o.person||null,
   by:(ME?ME.name:'system'),byId:(ME?ME.id:null),at:NOW(),text:text,
   kind:'human',edits:[],task:null,replyTo:o.replyTo||null};
 MSGS.push(m);
 log(ref,'message to '+roles.join('+')+(o.hub?'@'+o.hub:'')+(o.person?' · '+personName(o.person):''));
 return {ok:true,msg:m,readers:roles.map(function(r){var p=readerOfRole(r,o.hub);return p?p.name:r;})};
}
function sysPost(ref,text,textAr){
 MSGSEQ++;
 var m={id:'MSG-'+MSGSEQ,ref:ref,roles:[],person:null,by:'system',byId:null,
   at:NOW(),text:text,textAr:textAr||text,kind:'system',edits:[],task:null,replyTo:null};
 MSGS.push(m);
 return m;
}
function editMessage(id,text){
 var m=MSGS.find(function(x){return x.id===id;});
 if(!m||m.kind!=='human')return {ok:false};
 if(String(text||'').replace(/\s/g,'').length<2)return {ok:false,why:'an empty message says nothing'};
 m.edits.push({was:m.text,at:NOW(),by:(ME?ME.name:'')});     // the original stays readable
 m.text=text;
 return {ok:true};
}
function messageReaders(m){
 var out=[];
 m.roles.forEach(function(r){var p=readerOfRole(r,m.hub);if(p)out.push(p);});
 if(m.person){var pp=personById(m.person);if(pp&&out.indexOf(pp)===-1)out.push(pp);}
 return out;
}
function threadFor(role){
 return MSGS.filter(function(m){
  return m.roles.indexOf(role)>-1||(m.person&&personById(m.person)&&personById(m.person).role===role);
 });
}
// ── the record number is a door ──
function actionsFor(ref){return openItems().filter(function(it){return it.ref===ref;});}
// the records a message may be about — nothing is invented, nothing is assumed
function knownRecords(){
 var out=[],seen={};
 var add=function(id,kind,label){if(id&&!seen[id]){seen[id]=1;out.push({id:id,kind:kind,label:label||''});}};
 SHIPS.forEach(function(sp){add(sp.id,'shipment',sp.cust+' · '+sp.from+'→'+sp.to);});
 TRIPS.forEach(function(tp){add(tp.id,'trip',tp.route+' · '+tp.mode);});
 TRIPS.forEach(function(tp){tp.ships.forEach(function(sh2){add(sh2.id,'shipment',sh2.name);});});
 openItems().forEach(function(it){add(it.ref,'record','');});
 MSGS.forEach(function(m){add(m.ref,'record','');});
 return out;
}
function recordExists(ref){return knownRecords().some(function(r){return r.id===ref;});}
var REC_SHOW=8;
function findRecords(q){
 q=String(q||'').trim().toLowerCase();
 var all=knownRecords();
 if(!q)return all;
 var scored=[];
 all.forEach(function(r){
  var id=r.id.toLowerCase(), lb=String(r.label||'').toLowerCase(), sc=-1;
  if(id===q)sc=0; else if(id.indexOf(q)===0)sc=1; else if(id.indexOf(q)>-1)sc=2;
  else if(lb.indexOf(q)===0)sc=3; else if(lb.indexOf(q)>-1)sc=4;
  if(sc>=0)scored.push({r:r,s:sc});
 });
 scored.sort(function(a,b){if(a.s!==b.s)return a.s-b.s;return a.r.id<b.r.id?-1:1;});
 return scored.map(function(x){return x.r;});
}
function findRecordsPage(q){
 var hits=findRecords(q);
 return {rows:hits.slice(0,REC_SHOW),total:hits.length,hidden:Math.max(0,hits.length-REC_SHOW)};
}
function openRecord(ref){
 DRILL=null; openI=null;
 CHAT_REF=ref;
 var acts=actionsFor(ref);
 if(acts.length)openI=acts[0].id;
 sim='s8';render();
 return acts;
}
// ── message → task ──
function toTask(id,dueMs){
 var m=MSGS.find(function(x){return x.id===id;});
 if(!m||m.kind!=='human')return {ok:false,why:'only a written message becomes a task'};
 if(m.task)return {ok:false,why:'this message is already a task'};
 var role=m.roles[0], holder=m.person?personById(m.person):readerOfRole(role,m.hub);
 var wi=mk({ref:m.ref,title:m.text.slice(0,60),titleAr:m.text.slice(0,60),
   kind:'document',owner:holder?holder.id:null,role:holder?holder.role:role,
   next:m.text.slice(0,80),nextAr:m.text.slice(0,80),
   due:dueMs?NOW()+dueMs:null,allow:dueMs||DAY,touched:NOW()});
 m.task=wi.id;
 log(m.ref,'message became task '+wi.id);
 return {ok:true,task:wi};
}

// ── 1 · GLOBAL SEARCH — one field, everything, grouped by type, status inline ──
function searchAll(q){
 q=String(q||'').trim().toLowerCase();
 if(!q)return [];
 var out=[];
 var push=function(type,id,label,status,go){out.push({type:type,id:id,label:label,status:status,go:go});};
 SHIPS.forEach(function(sp){
  if((sp.id+' '+sp.cust+' '+sp.from+' '+sp.to+' '+sp.mode).toLowerCase().indexOf(q)>-1)
   push('shipment',sp.id,sp.cust+' · '+sp.from+'→'+sp.to,
     isDelivered(sp)?t('Delivered'):t('still running'),'s4');
 });
 TRIPS.forEach(function(tp){
  if((tp.id+' '+tp.route+' '+tp.mode).toLowerCase().indexOf(q)>-1)
   push('trip',tp.id,tp.route+' · '+tp.mode,gateState(tp.id)==='CLEARED'?t('CLEARED'):t('BLOCKED'),'s5');
  tp.ships.forEach(function(sh2){
   if((sh2.id+' '+sh2.name).toLowerCase().indexOf(q)>-1)push('shipment',sh2.id,sh2.name+' · '+tp.id,tp.id,'s5');
  });
  (tp.costs||[]).forEach(function(c){
   if((c.code+' '+c.supplier).toLowerCase().indexOf(q)>-1)push('cost',c.ref,costLabel(c.code)+' · '+c.supplier,money(c.amount),'s6');
  });
 });
 CLIENTS.forEach(function(c){
  var hay=c.id+' '+c.name+' '+c.tax+' '+c.contacts.map(function(k){return k.name+' '+k.phone+' '+k.email;}).join(' ');
  if(hay.toLowerCase().indexOf(q)>-1)push('client',c.id,c.name+(c.tax?' · '+c.tax:''),t(c.status),'s7');
 });
 openItems().forEach(function(it){
  if((it.id+' '+it.ref+' '+it.title+' '+it.next).toLowerCase().indexOf(q)>-1)
   push('work',it.id,it.title+' · '+it.ref,personName(it.owner),'s1');
 });
 PEOPLE.forEach(function(p){
  if((p.id+' '+p.name).toLowerCase().indexOf(q)>-1)push('person',p.id,p.name,t(roleById(p.role).name),'s1');
 });
 MSGS.forEach(function(m){
  if(m.text.toLowerCase().indexOf(q)>-1)push('message',m.id,m.text.slice(0,60)+' · '+m.ref,m.by,'s8');
 });
 return out;
}
function searchGrouped(q){
 var r=searchAll(q), g={}, order=[];
 r.forEach(function(x){if(!g[x.type]){g[x.type]=[];order.push(x.type);}g[x.type].push(x);});
 return order.map(function(k){return {type:k,rows:g[k]};});
}

// ── 2 · SIDEBAR BADGES — the count of records needing THIS user's action ──
function badgeFor(section){
 var role=ME.role, q=queueFor(role);
 if(section==='work')   return {n:q.length, red:q.filter(function(it){return overdue(it);}).length>0};
 if(section==='gates')  return {n:TRIPS.filter(function(tp){return tp.ships.length&&gateState(tp.id)==='BLOCKED';}).length, red:true};
 if(section==='clients')return {n:provisionalTray().length, red:provisionalTray().some(function(x){return x.ageDays>PROV_DAYS;})};
 if(section==='profit') return {n:TRIPS.reduce(function(a,tp){return a+unallocated(tp.id).length;},0), red:true};
 if(section==='speed')  return {n:SHIPS.filter(function(sp){return !isDelivered(sp)&&promiseTone(sp)==='red';}).length, red:true};
 if(section==='threads')return {n:myUnacked(role).length, red:false};
 if(section==='manager')return {n:unassigned().length+critical().length, red:true};
 return {n:0,red:false};
}
function badgeHTML(section){
 var b=badgeFor(section);
 if(!b.n)return '';
 return '<span class="machine" style="margin-'+(currentLang==='ar'?'right':'left')+':6px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:'+(b.red?'#E1483B':'#0EA5E9')+';color:#FFFFFF">'+b.n+'</span>';
}

function notifications(){
 var out=[], role=ME.role;
 myUnacked(role).forEach(function(it){

    text:t('a handover is waiting for you to accept'),act:'ack'});

 });
 queueFor(role).filter(function(it){return overdue(it)&&tone(it)!=='black';}).forEach(function(it){

 });
 unassigned().forEach(function(it){

  out.push({group:'action',id:'N-un-'+it.id,item:it,text:t('no owner — nobody is accountable for this'),act:'assign'});
 });
 MSGS.filter(function(m){return m.roles.indexOf(role)>-1&&m.kind==='human'&&!m.task;}).slice(-4).forEach(function(m){

 });

var NOTIF_READ={};
// opening the panel IS reading it — there is no button for what the eye already did.
// the pass that shows them still renders them as new, so nothing greys under your gaze.
function notifMarkSeen(list){

 list.forEach(function(x){was[x.id]=!!NOTIF_READ[x.id];NOTIF_READ[x.id]=1;});
 return was;
}
function notifUnread(){return notifications().filter(function(x){return !NOTIF_READ[x.id];});}

// ── 4 · THE CLOCK — local time, and the port's local time where it matters ──
var PORT_TZ=[
 {place:'Damascus',  off:3},
 {place:'Istanbul',  off:3},
 {place:'Dubai',     off:4},
 {place:'Guangzhou', off:8},
 {place:'Yiwu',      off:8},
 {place:'Delaware',  off:-4}
];
function tzOf(place){
 var p=PORT_TZ.find(function(x){return x.place===place;});
 return p?p.off:null;
}
function timeAt(place,now){
 var off=tzOf(place);
 if(off===null)return null;
 var d=new Date((now||NOW())+(off-3)*HOUR);        // our own base is UTC+3
 return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
function clockRow(places){
 return places.filter(function(p){return tzOf(p)!==null;}).map(function(p){
  return '<span style="display:inline-flex;gap:6px;align-items:center;font-size:var(--fs-hint);font-weight:800;padding:4px 10px;border-radius:999px;background:#EEF2F7;color:#0B2A3B">'
   +p+' <span class="machine">'+timeAt(p)+'</span></span>';
 }).join('');
}
function tripPlaces(tp){
 var out=[];
 String(tp.route||'').split('→').forEach(function(x){
  x=x.replace(/\s/g,'');
  if(tzOf(x)!==null)out.push(x);
 });
 return out;
}

var QC_KINDS=[
 {id:'work',    en:'Work item',   ar:'بند عمل',    need:['ref','role','next','due']},
 {id:'client',  en:'Client',      ar:'عميل',       need:['name','country','contact','reach']},
 {id:'message', en:'Message',     ar:'رسالة',      need:['ref','roles','text']},
 {id:'cost',    en:'Trip cost',   ar:'كلفة رحلة',  need:['trip','code','amount']},
 {id:'note',    en:'Shift note',  ar:'ملاحظة وردية',need:['text']}
];
function qcKindLabel(id){var k=QC_KINDS.find(function(x){return x.id===id;});return k?(currentLang==='ar'?k.ar:k.en):id;}
// context: on a screen that is about a record, the new thing inherits it
function qcContext(){
 if(sim==='s8'&&CHAT_REF)return {ref:CHAT_REF,why:'the thread you are reading'};
 if(sim==='s5'&&TRIPS.length)return {trip:TRIPS[0].id,why:'the trip on screen'};
 if(openI&&itemById(openI))return {ref:itemById(openI).ref,why:'the item you have open'};
 return {};
}
function quickCreateThing(kind,o){
 o=o||{};
 var missing=[];
 var need=(QC_KINDS.find(function(k){return k.id===kind;})||{}).need||[];
 need.forEach(function(fieldName){
  if(fieldName==='reach'){if(!o.phone&&!o.email)missing.push('phone or email');return;}
  if(fieldName==='roles'){if(!(o.roles&&o.roles.length))missing.push('role');return;}
  if(!o[fieldName])missing.push(fieldName);
 });
 if(missing.length)return {ok:false,need:missing};
 if(kind==='work'){
  var holder=readerOfRole(o.role,o.hub||'DAM');
  var wi=mk({ref:o.ref,title:o.next,titleAr:o.next,kind:'document',
    owner:holder?holder.id:null,role:o.role,next:o.next,nextAr:o.next,
    due:NOW()+Number(o.due)*HOUR,allow:Number(o.due)*HOUR});
  return {ok:true,id:wi.id,goto:'s1'};
 }
 if(kind==='client'){
  var r=quickCreate({name:o.name,country:o.country,contact:o.contact,phone:o.phone,email:o.email,type:o.type||'individual'},o.dismiss);
  if(!r.ok)return r;
  return {ok:true,id:r.id,goto:'s7'};
 }
 if(kind==='message'){
  var mr=postMessage({ref:o.ref,roles:o.roles,hub:o.hub||'DAM',text:o.text});
  if(!mr.ok)return mr;
  return {ok:true,id:mr.msg.id,goto:'s8'};
 }
 if(kind==='cost'){
  var dup=duplicateOf(o.trip,{code:o.code,amount:o.amount,supplier:o.supplier||''});
  if(dup&&!o.force)return {ok:false,why:'the same cost is already booked on this trip — void that one or change this amount'};
  var c=bookCost(o.trip,{code:o.code,amount:o.amount,supplier:o.supplier||'',key:o.key||'cbm'});
  return c?{ok:true,id:c.ref,goto:'s6'}:{ok:false,why:'no trip'};
 }
 if(kind==='note'){
  var nr=leaveNote(ME.role,o.text);
  if(!nr.ok)return nr;
  return {ok:true,id:'note',goto:'s0'};
 }
 return {ok:false,why:'unknown kind'};
}

// ── 2 · NOTICE BOARD — management speaking to everyone, dismissible per user ──
// who a notice is for: everyone, or any mix of roles · hubs · countries · named people
function audienceEmpty(a){return !a||(!a.all&&!(a.roles||[]).length&&!(a.hubs||[]).length&&!(a.countries||[]).length&&!(a.people||[]).length);}
/* ── the notice board, published ──────────────────────────────────────
   These have always lived here, with an audience, a read state per person and a
   warning when one goes out untranslated. Nothing outside this file could see
   them, so the console started to grow a second, poorer board — the audience
   reduced to a level number. Published now: whoever displays them applies the
   same audience test D1 applies, because it travels with them. */
var SL_REG_NOTICES='SL_NOTICES_V1';
function noticeRegistry(){
 return NOTICES.map(function(nb){
  /* the audience leaves in the REGISTER's vocabulary: a notice addressed to
     'ops' here must reach the person C9 calls 'disp', or it is addressed to
     nobody at all — which is how a warehouse closure reaches the wrong people */
  var aud=nb.audience||{all:true}, out2={all:!!aud.all};
  if(aud.people)out2.people=aud.people.slice();
  if(aud.hubs)out2.hubs=aud.hubs.slice();
  if(aud.countries)out2.countries=aud.countries.slice();
  if(aud.roles){
   /* two local names may map to one position — 'ops' and 'docs' are both the
      coordinator — so the audience is de-duplicated on the way out rather than
      addressing the same man twice */
   var seenR={},list=[];
   aud.roles.forEach(function(r){var c=roleCanon(r);if(!seenR[c]){seenR[c]=1;list.push(c);}});
   out2.roles=list;
  }
  return {id:nb.id,at:nb.at,by:nb.by,kind:nb.kind,
          audience:out2,
          en:nb.en,ar:nb.ar,untranslated:!!nb.untranslated};
 });
}
function slNoticesPublish(){
 try{
  window.localStorage.setItem(SL_REG_NOTICES,JSON.stringify({
   at:new Date().getTime(),notices:noticeRegistry()}));
  return true;
 }catch(e){return false;}
}
function noticeFor(nb,person){
 var p=person||ME;
 var a=nb.audience;
 if(!a||a.all)return true;
 if((a.people||[]).indexOf(p.id)>-1)return true;
 if((a.roles||[]).indexOf(p.role)>-1)return true;
 if((a.hubs||[]).indexOf(p.hub)>-1)return true;
 if((a.countries||[]).indexOf(countryOfPerson(p))>-1)return true;
 return false;
}
function audienceLabel(a){
 if(!a||a.all)return t('everyone');
 var parts=[];
 (a.roles||[]).forEach(function(r){parts.push('@'+t(roleById(r).name));});
 (a.hubs||[]).forEach(function(h){parts.push('📍'+hubLabel(h));});
 (a.countries||[]).forEach(function(c){parts.push('🌐'+countryLabel(c));});
 (a.people||[]).forEach(function(x){parts.push(personName(x));});
 return parts.join(' · ');
}
var NOTICES=[
 {id:'NB-1',at:T0-2*DAY,by:'Omar Al-Masri',kind:'advisory',audience:{countries:['TR','SY']},

 var d=new Date(NOW());
 return modalHTML()
  +'<div class="card" style="padding:var(--pad-card);margin-bottom:13px">'
  +'<div class="eyebrow" style="margin-bottom:5px">'+t('Advance the clock')+'</div>'
  +'<div class="hint" style="margin-bottom:11px">'+t('the whole engine reads this clock — tests move it, they never wait')+'</div>'
  +'<div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">'
  +'<span class="machine" style="font-family:var(--disp);font-weight:800;letter-spacing:-.025em;font-size:var(--fs-figure)">'
  +('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+'</span>'
  +'<span class="hint machine">'+slDateStr(d)+'</span>'
  +'<span style="margin-left:auto"></span>'
  +btn(t('+1h'),HOUR)+btn(t('+4h'),4*HOUR)+btn(t('+1d'),DAY)+btn(t('+2d'),2*DAY)+btn(t('+3d'),3*DAY)
  +'<button onclick="resetClock()" style="cursor:pointer;font-family:var(--body);font-weight:800;padding:0 16px;border-radius:10px;border:1.5px solid rgba(11,42,59,.18);background:#FFFFFF;color:#0B2A3B">'+t('reset')+'</button>'
  +'</div></div>'
  +'<div class="card" style="padding:var(--pad-card)">'
  +'<div class="eyebrow" style="margin-bottom:9px">'+t('all queues')+'</div>'
  +openItems().slice().sort(function(a,b){return (a.due||9e15)-(b.due||9e15);}).map(itemCard).join('')
  +'</div>'+auditCard();
}

// ── S4 speed board: how long we actually take, receipt → POD ──
function fmtDays(ms){
 var d=ms/DAY;
 return (d<10?Math.round(d*10)/10:Math.round(d))+'d';
}
function barFor(s){
 var sl=slices(s), tot=slicesSum(s)||1, w=worstSlice(s);
 var col={received:'#94A3B8',consolidated:'#7DD3FC',departed:'#0EA5E9',border:'#F59E0B',arrived:'#38BDF8',cleared:'#A78BFA'};
 return '<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;background:#EEF2F7">'
  +sl.map(function(x){
    var pc=Math.max(1,Math.round(x.ms/tot*100));
    var isW=w&&x.from===w.from;
    return '<div title="'+(currentLang==='ar'?MS_LABEL_AR[x.from]:MS_LABEL[x.from])+' · '+fmtDays(x.ms)+'" style="width:'+pc+'%;background:'+(col[x.from]||'#CBD5E1')+';'+(isW?'box-shadow:inset 0 0 0 2px #991B1B;':'')+'"></div>';
   }).join('')
  +'</div>';
}
function shipRow(s){
 var lt=lifetime(s), cw=clientWait(s), ct=controlled(s), pr=promiseOf(s), tn=promiseTone(s), w=worstSlice(s);
 var tcol={green:'#065F46',amber:'#78500A',red:'#991B1B',grey:'rgba(11,42,59,.45)'}[tn];
 var tbg={green:'#DCF5E9',amber:'#FDF0D5',red:'#FBE3E1',grey:'#EEF2F7'}[tn];
 return '<div class="card" style="margin-bottom:10px;padding:var(--pad-card)">'
  +'<div style="display:flex;gap:var(--gap);align-items:center;flex-wrap:wrap;margin-bottom:10px">'
  +'<span style="font-size:19px">'+(isDelivered(s)?'✓':'🚚')+'</span>'
  +'<div style="flex:1;min-width:170px">'
  +'<div style="font-family:var(--disp);font-size:var(--fs-lead);font-weight:800;letter-spacing:-.025em">'+s.cust+'</div>'
  +'<div class="hint machine">'+s.id+' · '+s.from+'→'+s.to+' · '+s.mode+'</div></div>'
  // the two figures, always together and always labelled
  +'<div><div class="eyebrow">'+t('total, as the client felt it')+'</div>'
  +'<div class="machine figure">'+fmtDays(lt)+'</div></div>'
  +'<div><div class="eyebrow">'+t('under our control')+'</div>'
  +'<div class="machine" style="font-family:var(--disp);font-weight:800;letter-spacing:-.025em;font-size:var(--fs-title);color:#0A4A6B">'+fmtDays(ct)+'</div></div>'
  +(cw?'<div><div class="eyebrow">'+t('client wait')+'</div>'
    +'<div class="machine" style="font-family:var(--disp);font-weight:800;letter-spacing:-.025em;font-size:var(--fs-title);color:#78500A">'+fmtDays(cw)+'</div></div>':'')
  +'<div style="border-left:1px solid rgba(11,42,59,.1);padding-left:16px">'
  +'<div class="eyebrow">'+t('promise')+'</div>'
  +(pr?'<span class="machine" style="font-size:var(--fs-hint);font-weight:800;padding:5px 11px;border-radius:999px;background:'+tbg+';color:'+tcol+'">'+fmtDays(pr)+' · '+Math.round(promisePct(s)*100)+'%</span>'
     :'<span style="font-size:var(--fs-hint);font-weight:800;padding:5px 11px;border-radius:999px;background:#EEF2F7;color:#62707A">'+t('unpromised')+'</span>')
  +'</div>'
  +(isDelivered(s)?'':'<span style="font-size:var(--fs-hint);font-weight:800;padding:4px 10px;border-radius:999px;background:#E6F4FE;color:#0A4A6B">'+t('still running')+'</span>')
  +'</div>'
  +barFor(s)
  +'<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">'
  +slices(s).map(function(x){
     var isW=w&&x.from===w.from;
     return '<span class="hint" style="font-weight:'+(isW?'800':'700')+';color:'+(isW?'#991B1B':'rgba(11,42,59,.55)')+'">'
      +(currentLang==='ar'?MS_LABEL_AR[x.from]:MS_LABEL[x.from])+' <span class="machine">'+fmtDays(x.ms)+'</span>'+(isW?' ◂':'')+'</span>';
   }).join('')
  +'</div>'
  +(cw?'<div class="hint" style="margin-top:7px;color:#78500A;font-weight:700">⏸ '+t('client wait')+': '+s.waits.map(function(wt){return wt.why;}).join(' · ')+'</div>':'')
  +(isDelivered(s)?'':'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:9px">'
    +(s.waits.some(function(wt){return wt.to===null;})
      ?'<button onclick="closeWait(\''+s.id+'\');render()" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:6px 13px;border-radius:9px;border:none;background:#0A7250;color:#FFFFFF">▶ '+t('the client responded — resume')+'</button>'
      :'<button onclick="askWait(\''+s.id+'\')" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:6px 13px;border-radius:9px;border:1.5px solid rgba(251,191,36,.6);background:#FFF7E6;color:#78500A">⏸ '+t('we are waiting on the client')+'</button>')
    +'<button onclick="pod(\''+s.id+'\');render()" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:6px 13px;border-radius:9px;border:1.5px solid rgba(11,42,59,.18);background:#FFFFFF;color:#0B2A3B">✓ '+t('POD signed — stop the clock')+'</button>'
    +'</div>')
  +'</div>';
}
function askWait(id){
 askReason(t('Waiting on the client?'),t('the total clock keeps running — this only records what was outside our control'),t('Confirm'),function(reason){
  startWait(id,reason);render();
 });
}
function renderS4(){
 var running=SHIPS.filter(function(s){return !isDelivered(s);});
 var done=SHIPS.filter(isDelivered);
 var lanes=[];
 SHIPS.forEach(function(s){
  var k=s.from+'|'+s.to+'|'+s.mode;
  if(lanes.indexOf(k)===-1)lanes.push(k);
 });
 var h=modalHTML()
  +'<div class="card" style="padding:var(--pad-card);margin-bottom:13px">'
  +'<div class="eyebrow" style="margin-bottom:5px">'+t('Delivery speed')+'</div>'
  +'<div style="font-size:var(--fs-body);font-weight:700">'+t('receipt to POD — nothing internal resets this clock')+'</div>'
  +'<div class="hint" style="margin-top:5px">'+t('the total is what the client lived through · performance is judged on the time under our control')+'</div>'
  +'</div>';
 // lane averages
 h+='<div class="card" style="padding:var(--pad-card);margin-bottom:13px">'
  +'<div class="eyebrow" style="margin-bottom:9px">'+t('Average by lane × mode')+' — '+t('delivered shipments only')+'</div>'
  +'<div style="display:flex;gap:10px;padding:5px 10px;font-family:var(--mono);font-size:var(--fs-eyebrow);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#62707A">'
  +'<span style="flex:1.4">'+t('lane')+'</span><span style="width:90px;text-align:right">'+t('promise')+'</span>'
  +'<span style="width:90px;text-align:right">'+t('total')+'</span><span style="width:110px;text-align:right">'+t('controlled')+'</span>'
  +'<span style="width:150px;text-align:right">'+t('suggested promise')+'</span></div>'
  +lanes.map(function(k){
    var p=k.split('|'), a=avgLane(p[0],p[1],p[2]), pr=promiseFor(p[0],p[1],p[2]), sg=suggestPromise(p[0],p[1],p[2]);
    return '<div style="display:flex;gap:10px;align-items:center;padding:9px 10px;border-top:1px solid rgba(11,42,59,.07)">'
     +'<span style="flex:1.4;font-size:var(--fs-body);font-weight:700">'+p[0]+'→'+p[1]+' <span class="hint">'+p[2]+'</span></span>'
     +'<span class="machine" style="width:90px;text-align:right;font-weight:800">'+(pr?fmtDays(pr):'<span style="color:#62707A">'+t('unpromised')+'</span>')+'</span>'
     +'<span class="machine" style="width:90px;text-align:right">'+(a?fmtDays(a.avg):'—')+'</span>'
     +'<span class="machine" style="width:110px;text-align:right;font-weight:800;color:#0A4A6B">'+(a?fmtDays(a.avgControlled):'—')+'</span>'
     +'<span style="width:150px;text-align:right">'+(sg?('<span class="machine" style="font-weight:800">'+sg.days+'d</span> <span class="hint">n='+sg.n+(sg.thin?' · '+t('thin')+'':'')+'</span>'):'<span class="hint">—</span>')+'</span>'
     +'</div>';
   }).join('')
  +'<div class="hint" style="margin-top:9px">'+t('a promise built on fewer than 5 deliveries is marked thin — it is an indication, not a fact')+'</div>'
  +'</div>';
 h+='<div class="eyebrow" style="margin-bottom:8px">'+t('still running')+' · <span class="machine">'+running.length+'</span></div>'
  +(running.length?running.map(shipRow).join(''):'<div class="hint" style="margin-bottom:12px">—</div>');
 h+='<div class="eyebrow" style="margin:14px 0 8px">'+t('Delivered')+' · <span class="machine">'+done.length+'</span></div>'
  +done.map(shipRow).join('');
 return h;
}


// ── S5 document gates: BLOCKED or CLEARED, and nothing in between ──
function gateBadge(tp){
 var st=gateState(tp.id);
 var cleared=st==='CLEARED';
 return '<span style="font-family:var(--disp);font-weight:800;letter-spacing:.06em;font-size:var(--fs-lead);padding:9px 18px;border-radius:11px;background:'
  +(cleared?'#10B981':'#E1483B')+';color:#FFFFFF">'+(cleared?'✓ '+t('CLEARED'):'⛔ '+t('BLOCKED'))+'</span>';
}
function askVoidDoc(tripId,ref){
 askReason(t('Void this document?'),t('it is never deleted — it stays on the record marked void, and the gate closes again'),t('Confirm'),function(reason){
  if(!voidDoc(tripId,ref,reason))askConfirm(t('Refused'),'<b style="color:#991B1B">'+t('reason is required')+'</b>',t('Close'),true,function(){});
 });
}
function doReplaceDoc(tripId,ref){
 askConfirm(t('Replace it?'),t('the old one is superseded and kept — both versions stay on the record'),t('Confirm'),false,function(){
  replaceDoc(tripId,ref,{});render();
 });
}
function docChip(tp,code,ship){
 var why=docWhy(tp,code,ship);
 var d=tp.docs.filter(function(x){return x.code===code&&x.ship===ship;}).slice(-1)[0];
 var bg=!why?'#DCF5E9':(why==='missing'?'#FBE3E1':'#FDF0D5');
 var fg=!why?'#065F46':(why==='missing'?'#991B1B':'#78500A');
 var mark=!why?'✓':(why==='missing'?'✕':(why==='expired'?'⌛':'⊘'));
 var extra='';
 if(d&&d.expires&&!d.void){
  var left=expiresIn(d);
  extra=' <span class="machine" style="opacity:.75">'+(left>0?Math.ceil(left/DAY)+'d':t('expired'))+'</span>';
 }
 var live=d&&!d.void&&docLive(d);
 return '<span style="display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-hint);font-weight:800;padding:6px 12px;border-radius:999px;background:'+bg+';color:'+fg+'">'
  +mark+' '+docLabel(code)+extra
  +(why&&why!=='missing'?' <span style="opacity:.8">'+t(why)+'</span>':'')
  +(live?'<button onclick="askVoidDoc(\''+tp.id+'\',\''+d.ref+'\')" title="'+t('Void')+'" style="cursor:pointer;border:none;background:transparent;color:'+fg+';font-weight:800;padding:0 2px">✕</button>'
        +'<button onclick="doReplaceDoc(\''+tp.id+'\',\''+d.ref+'\')" title="'+t('replace')+'" style="cursor:pointer;border:none;background:transparent;color:'+fg+';font-weight:800;padding:0 2px">⟳</button>':'')
  +'</span>';
}
function tripGateCard(tp){
 var chk=gateCheck(tp.id), req=requiredFor(tp.mode,tp.dir,tp.stage);
 var tripReq=req.filter(function(r){return r.level==='trip';});
 var shipReq=req.filter(function(r){return r.level==='ship';});
 var h='<div class="card" style="margin-bottom:12px;overflow:hidden;border-color:'+(chk.ok?'rgba(16,185,129,.45)':'rgba(225,72,59,.45)')+'">'
  +'<div style="display:flex;gap:var(--gap);align-items:center;padding:var(--pad-row);background:'+(chk.ok?'#E9F8F1':'#FFF7F6')+'">'
  +'<span style="font-size:21px">'+(tp.mode==='land'?'🚚':(tp.mode==='sea'?'🚢':'✈'))+'</span>'
  +'<div style="flex:1;min-width:160px">'
  +'<div style="font-family:var(--disp);font-size:var(--fs-lead);font-weight:800;letter-spacing:-.025em">'+tp.id+'</div>'
  +'<div class="hint">'+tp.route+' · '+tp.mode+' · <span class="machine">'+tp.ships.length+'</span> '+t('shipments')+'</div>'
  +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">'+clockRow(tripPlaces(tp))+'</div></div>'
  +(tp.overridden?'<span style="font-size:var(--fs-hint);font-weight:800;padding:5px 11px;border-radius:999px;background:#FDF0D5;color:#78500A">⚠ '+t('overridden')+'</span>':'')
  +gateBadge(tp)
  +'</div>'
  +'<div style="padding:var(--pad-card)">';
 if(tripReq.length){
  h+='<div class="eyebrow" style="margin-bottom:7px">'+t('trip documents')+'</div>'
   +'<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px">'
   +tripReq.map(function(r){return docChip(tp,r.code,null);}).join('')+'</div>';
 }
 tp.ships.forEach(function(s){
  var bad=chk.missing.filter(function(m){return m.ship===s.id;}).length;
  h+='<div style="padding:10px 12px;border-radius:10px;border:1.5px solid '+(bad?'rgba(225,72,59,.35)':'rgba(11,42,59,.09)')+';background:'+(bad?'#FFF7F6':'#FFFFFF')+';margin-bottom:7px">'
   +'<div style="display:flex;gap:9px;align-items:center;margin-bottom:7px">'
   +'<span style="font-weight:800;font-size:var(--fs-body)">'+s.name+'</span>'
   +'<span class="hint machine">'+s.id+'</span>'
   +(bad?'<span style="margin-left:auto;font-size:var(--fs-hint);font-weight:800;color:#991B1B">'+bad+' '+t('missing')+'</span>':'')
   +'</div>'
   +'<div style="display:flex;gap:7px;flex-wrap:wrap">'
   +shipReq.map(function(r){return docChip(tp,r.code,s.id);}).join('')
   +'</div></div>';
 });
 if(!chk.ok){
  h+='<div style="margin-top:10px;padding:12px 14px;border-radius:11px;background:#FBE3E1;border:1.5px solid rgba(225,72,59,.4)">'
   +'<div style="font-weight:800;font-size:var(--fs-body);color:#991B1B;margin-bottom:6px">⛔ '+t('departure refused — the pack is incomplete')+'</div>'
   +'<div style="font-size:var(--fs-body);color:#991B1B">'
   +(chk.why==='no shipments'?t('no shipments on this trip')
     :chk.missing.map(function(m){return (m.ship?'<b class="machine">'+m.ship+'</b> · ':'')+docLabel(m.code)+' <span style="opacity:.75">('+t(m.why)+')</span>';}).join('<br>'))
   +'</div>'
   +(ME.role==='manager'
     ?'<button onclick="askOverride(\''+tp.id+'\')" style="cursor:pointer;margin-top:10px;font-family:var(--body);font-weight:800;padding:0 18px;border-radius:10px;border:1.5px solid rgba(225,72,59,.5);background:#FFFFFF;color:#B23429">'+t('Override with a reason')+'</button>'
     :'<div class="hint" style="margin-top:8px;font-weight:800;color:#991B1B">'+t('only the manager may override a gate')+'</div>')
   +'</div>';
 } else {
  h+='<button onclick="doExit(\''+tp.id+'\')" style="cursor:pointer;margin-top:10px;font-family:var(--body);font-weight:800;padding:0 20px;border-radius:10px;border:none;background:#0A7250;color:#FFFFFF">'+t('Release to the driver')+'</button>';
 }
 // quick attach for the demo
 var missCodes=[];
 chk.missing.forEach(function(m){if(m.why==='missing')missCodes.push(m);});
 if(missCodes.length){
  h+='<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
   +'<span class="hint" style="font-weight:800">'+t('attach the missing one')+':</span>'
   +missCodes.map(function(m){
     return '<button onclick="attach(\''+tp.id+'\',\''+m.code+'\','+(m.ship?'{ship:\''+m.ship+'\'}':'{}')+');render()" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:7px 13px;border-radius:9px;border:1.5px dashed rgba(14,165,233,.55);background:#F4FBFF;color:#0A4A6B">📎 '+docLabel(m.code)+(m.ship?' · '+m.ship:'')+'</button>';
    }).join('')
   +'</div>';
 }
 return h+'</div></div>';
}
function doExit(id){
 var r=tryExit(id);
 askConfirm(r.ok?t('Released'):t('Refused'),
  r.ok?('<b>'+id+'</b><br>'+t('the pack is complete and the trip may depart'))
      :('<b style="color:#991B1B">'+t('departure refused — the pack is incomplete')+'</b>'),
  t('Close'),!r.ok,function(){});
}
function askOverride(id){
 askReason(t('Override the gate?'),
  '<b>'+id+'</b><br>'+t('The documents stay missing. The override is recorded with your name and reviewed weekly.'),
  t('Confirm'),function(reason){
   var r=overrideGate(id,null,reason,ME.role);
   if(!r.ok)askConfirm(t('Refused'),'<b style="color:#991B1B">'+t(r.why)+'</b>',t('Close'),true,function(){});
  });
}
function renderS5(){
 var h=modalHTML()
  +'<div class="card" style="padding:var(--pad-card);margin-bottom:13px">'
  +'<div class="eyebrow" style="margin-bottom:5px">'+t('Document gates')+'</div>'
  +'<div style="font-size:var(--fs-body);font-weight:700">'+t('a stage cannot be exited while a required document is missing — this is a refusal, not a warning')+'</div>'
  +'<div class="hint" style="margin-top:5px">'+t('the checklist is generated from mode, direction and stage · the pack checks every shipment on the trip')+'</div>'
  +'</div>'

 var ov=overrides();
 h+='<div class="card" style="margin-top:13px;padding:var(--pad-card)'+(ov.length?';border-color:rgba(251,191,36,.55)':'')+'">'

    return '<div style="padding:9px 0;border-bottom:1px solid rgba(11,42,59,.05);font-size:var(--fs-body)">'

// ── S6 profit board: who actually paid for this trip, and who actually earned ──
function money(n){
 var v=Number(n)||0, neg=v<0; v=Math.abs(v);
 var s2=(Math.round(v*100)/100).toFixed(2), p=s2.split('.'), i=p[0], out='';
 while(i.length>3){out=','+i.slice(-3)+out;i=i.slice(0,-3);}
 return (neg?'−':'')+i+out+'.'+p[1];
}
function costRow(tp,x){
 var c=x.cost, r=x.res;
 return '<div style="padding:11px 13px;border:1.5px solid '+(r.ok?'rgba(11,42,59,.09)':'rgba(225,72,59,.4)')+';border-radius:10px;margin-bottom:7px;background:'+(r.ok?'#FFFFFF':'#FFF7F6')+'">'
  +'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
  +'<span style="flex:1;min-width:150px;font-size:var(--fs-body);font-weight:800">'+costLabel(c.code)
  +' <span class="hint" style="font-weight:700">'+c.supplier+'</span></span>'

       priorities sorted by consequence then deadline, and his day by the hour;

var recQ='';                                   // the search box for choosing a record
function setRecQ(v){recQ=v;render();}
function pickRecord(id){CHAT_REF=id;recQ='';cm={roles:{},person:'',text:'',reply:null};render();}
function clearRecord(){CHAT_REF=null;recQ='';render();}
function recordPicker(){
 var page=findRecordsPage(recQ), typedQ=String(recQ).trim().length>0;
 return '<div class="card" style="padding:var(--pad-card);margin-bottom:13px;border:2px solid '+(CHAT_REF?'rgba(16,185,129,.45)':'rgba(225,72,59,.45)')+'">'
  +'<div class="eyebrow" style="margin-bottom:6px">'+(CHAT_REF?'✓ '+t('writing about'):'⛔ '+t('choose the shipment or trip first'))+'</div>'
  +(CHAT_REF
    ?'<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'
      +'<span class="machine" style="font-family:var(--disp);font-size:var(--fs-title);font-weight:800;letter-spacing:-.025em">'+CHAT_REF+'</span>'
      +'<span class="hint">'+((findRecords(CHAT_REF)[0]||{}).label||'')+'</span>'
      +'<button onclick="clearRecord()" style="cursor:pointer;margin-left:auto;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:6px 13px;border-radius:9px;border:1.5px solid rgba(11,42,59,.18);background:#FFFFFF;color:#0B2A3B">'+t('change the record')+'</button></div>'
    :'<div class="hint" style="margin-bottom:8px">'+t('a message is always about something — there is no general channel')+'</div>'
     +'<div style="position:relative;max-width:470px">'
     +'<input id="rec-q" type="text" autocomplete="off" value="'+String(recQ).replace(/"/g,'&quot;')+'" oninput="setRecQ(this.value)" placeholder="'+t('start typing a number or a name')+'" style="width:100%;border:1.5px solid '+(typedQ?'#0EA5E9':'rgba(11,42,59,.15)')+';border-radius:10px;padding:0 12px;height:var(--ctl-h);font-family:var(--body);font-size:var(--fs-body);background:#FFFFFF">'
     +(typedQ
       ?'<div style="position:absolute;left:0;right:0;top:calc(var(--ctl-h) + 5px);z-index:40;background:#FFFFFF;border:1.5px solid rgba(14,165,233,.45);border-radius:11px;box-shadow:0 14px 34px -14px rgba(11,42,59,.4);overflow:hidden">'
         +(page.total
           ?page.rows.map(function(r){var nth=threadOf(r.id).length;
             return '<button onclick="pickRecord(\''+r.id+'\')" style="cursor:pointer;display:block;width:100%;text-align:'+(currentLang==='ar'?'right':'left')+';padding:9px 13px;border:none;border-bottom:1px solid rgba(11,42,59,.06);background:#FFFFFF">'
              +'<span class="machine" style="font-weight:800">'+r.id+'</span>'
              +'<span class="hint" style="margin-'+(currentLang==='ar'?'right':'left')+':8px">'+(r.label||'')+'</span>'
              +'<span class="hint" style="float:'+(currentLang==='ar'?'left':'right')+'">'+(nth?nth+' '+t('messages'):t('no thread yet'))+'</span></button>';
            }).join('')
            +'<div style="padding:8px 13px;background:#F7F4EC" class="hint">'
            +(page.hidden?(t('showing')+' <span class="machine">'+page.rows.length+'</span> '+t('of')+' <span class="machine">'+page.total+'</span> — '+t('keep typing to narrow it'))
                         :(t('showing')+' '+t('all')+' <span class="machine">'+page.total+'</span>'))
            +'</div>'
           :'<div style="padding:12px 14px" class="hint">'+t('no record matches that')+'</div>')
        +'</div>'
       :'<div class="hint" style="margin-top:7px">'+t('type at least one character')+' — <span class="machine">'+knownRecords().length+'</span> '+t('records available')+'</div>')
     +'</div>')
  +'</div>';
}
function cmRole(r){cm.roles[r]=!cm.roles[r];render();}
function cmSet(k,v){cm[k]=v;
 var b=document.getElementById('cm-go');
 if(b){var okNow=cmReady();b.disabled=!okNow;b.style.cursor=okNow?'pointer':'not-allowed';
  b.style.background=okNow?'#10B981':'#E4E9F0';b.style.color=okNow?'#FFFFFF':'rgba(11,42,59,.4)';}}
function cmRoles(){var out=[];for(var k in cm.roles)if(cm.roles[k])out.push(k);return out;}
function cmReady(){return !!(CHAT_REF&&cmRoles().length&&String(cm.text).replace(/\s/g,'').length>1);}
function doPost(){
 var r=postMessage({ref:CHAT_REF,roles:cmRoles(),hub:cm.hub,person:cm.person||null,text:cm.text,replyTo:cm.reply});
 if(!r.ok){askConfirm(t('Refused'),'<b style="color:#991B1B">'+t(r.why)+'</b>',t('Close'),true,function(){});return;}
 cm={roles:{},hub:cm.hub,person:'',text:'',reply:null};render();
}
function askEdit(id){
 var m=MSGS.find(function(x){return x.id===id;});
 askReason(t('Edit this message?'),t('the original stays readable in the history and the message is marked edited')+'<div class="hint" style="margin-top:7px">'+t('now')+': '+m.text+'</div>',t('Save'),function(txt){
  var r=editMessage(id,txt);
  if(!r.ok)askConfirm(t('Refused'),'<b style="color:#991B1B">'+t(r.why||'an empty message says nothing')+'</b>',t('Close'),true,function(){});
  else render();
 });
}
function askToTask(id){
 askConfirm(t('Turn this into a task?'),
  t('it takes the record and the role from the message, and enters the same escalation engine as every other item'),
  t('Confirm'),false,function(){
   var r=toTask(id,DAY);
   if(!r.ok)askConfirm(t('Refused'),'<b style="color:#991B1B">'+t(r.why)+'</b>',t('Close'),true,function(){});
  });
}
function msgRow(m){
 var sys=m.kind==='system';
 var d=new Date(m.at);
 return '<div style="display:flex;gap:11px;padding:11px 13px;border-radius:11px;margin-bottom:8px;background:'+(sys?'#F7F4EC':'#FFFFFF')+';border:1.5px solid '+(sys?'rgba(11,42,59,.09)':'rgba(14,165,233,.22)')+'">'
  +'<span style="font-size:17px">'+(sys?'⚙':'💬')+'</span>'
  +'<div style="flex:1;min-width:180px">'
  +'<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:4px">'
  +'<span style="font-weight:800;font-size:var(--fs-body)">'+(sys?t('system'):m.by)+'</span>'
  +m.roles.map(function(r){return '<span style="font-size:var(--fs-hint);font-weight:800;padding:3px 9px;border-radius:999px;background:#E6F4FE;color:#0A4A6B">@'+t(roleById(r).name)+'</span>';}).join('')
  +(m.hub?'<span style="font-size:var(--fs-hint);font-weight:800;padding:3px 9px;border-radius:999px;background:#DCF5E9;color:#065F46">📍 '+hubLabel(m.hub)+'</span>':'')
  +(m.person?'<span style="font-size:var(--fs-hint);font-weight:800;padding:3px 9px;border-radius:999px;background:#EEF2F7;color:#0B2A3B">'+personName(m.person)+'</span>':'')
  +'<span class="machine hint">'+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+'</span>'
  +(m.edits.length?'<span class="hint">('+t('edited')+')</span>':'')
  +'</div>'
  +'<div style="font-size:var(--fs-body);line-height:1.6">'+((sys&&currentLang==='ar')?m.textAr:m.text)+'</div>'
  +(m.roles.length?'<div class="hint" style="margin-top:4px">'+t('reaches')+': '+messageReaders(m).map(function(p){return p.name;}).join(' · ')+'</div>':'')
  +(m.task?'<div class="hint" style="margin-top:5px;font-weight:800;color:#065F46">✓ '+t('became task')+' <span class="machine">'+m.task+'</span></div>':'')
  +'</div>'
  +(sys||m.byId!==ME.id?'':'<button onclick="askEdit(\''+m.id+'\')" style="cursor:pointer;align-self:flex-start;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:6px 11px;border-radius:9px;border:1.5px solid rgba(11,42,59,.15);background:#FFFFFF;color:#62707A">'+t('edit')+'</button>')
  +(sys||m.task?'':'<button onclick="askToTask(\''+m.id+'\')" style="cursor:pointer;align-self:flex-start;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:6px 12px;border-radius:9px;border:1.5px solid rgba(14,165,233,.5);background:#F4FBFF;color:#0A4A6B">→ '+t('make it a task')+'</button>')
  +'</div>';
}
function renderS8(){
 var refs=threadRefs();
 var thread=CHAT_REF?threadOf(CHAT_REF):[];
 var acts=CHAT_REF?actionsFor(CHAT_REF):[];
 var h=modalHTML()
  +'<div class="card" style="padding:var(--pad-card);margin-bottom:13px">'
  +'<div class="eyebrow" style="margin-bottom:5px">'+t('Threads')+'</div>'
  +'<div style="font-size:var(--fs-body);font-weight:700">'+t('every message names the record it is about and the role that must act')+'</div>'
  +'<div class="hint" style="margin-top:5px">'+t('the conversation stays with the job — when someone leaves the company, the context does not leave with them')+'</div></div>'
  +recordPicker()
  // the records that already have a conversation
  +(refs.length?'<div class="eyebrow" style="margin-bottom:6px">'+t('records with a thread')+' · <span class="machine">'+refs.length+'</span>'+(refs.length>6?' — '+t('the rest are in the search above'):'')+'</div>'
   +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px">'
   +refs.slice(0,6).map(function(r){var on=CHAT_REF===r;
     return '<button onclick="pickRecord(\''+r+'\')" style="cursor:pointer;font-family:var(--body);font-weight:800;padding:8px 14px;border-radius:999px;border:1.5px solid '+(on?'#0EA5E9':'rgba(11,42,59,.14)')+';background:'+(on?'#E6F4FE':'#FFFFFF')+';color:'+(on?'#0A4A6B':'#0B2A3B')+'"><span class="machine">'+r+'</span> <span class="hint">'+threadOf(r).length+'</span></button>';
    }).join('')+'</div>':'');
 if(!CHAT_REF)return h;
 // the record is a door
 h+='<div class="card" style="margin-bottom:12px;padding:var(--pad-card);border-color:rgba(16,185,129,.4);background:#F3FBF7">'
  +'<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'
  +'<span class="machine" style="font-family:var(--disp);font-size:var(--fs-title);font-weight:800;letter-spacing:-.025em">'+CHAT_REF+'</span>'
  +'<span class="hint">'+(acts.length?(acts.length+' '+t('open action(s) on this record')):t('nothing open on this record'))+'</span>'
  +'<span style="margin-left:auto"></span>'
  +(acts.length?'<button onclick="openRecord(\''+CHAT_REF+'\')" style="cursor:pointer;font-family:var(--body);font-weight:800;padding:0 18px;border-radius:10px;border:none;background:#0A7250;color:#FFFFFF">→ '+t('go and act')+'</button>':'')
  +'</div>'
  +(acts.length?'<div style="margin-top:9px">'+acts.map(itemCard).join('')+'</div>':'')
  +'</div>';
 // the timeline
 h+=thread.map(msgRow).join('');
 // compose — record and role are not optional
 h+='<div class="card" style="margin-top:12px;padding:var(--pad-card);border:2px solid rgba(14,165,233,.4)">'
  +'<div class="eyebrow" style="margin-bottom:7px">'+t('write on')+' <span class="machine">'+CHAT_REF+'</span></div>'
  +'<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px;align-items:center">'
  +'<span class="hint" style="font-weight:800">'+t('at')+':</span>'
  +slPicker('cm-hub',HUBS,cm.hub,"cmSet('hub','{v}');render()",{label:function(h){return currentLang==='ar'?h.ar:h.en;},blank:t('choose a hub'),width:'190px'})
  +'</div>'
  +'<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px">'
  +'<span class="hint" style="font-weight:800;align-self:center">'+t('addressed to')+':</span>'
  +ROLES.filter(function(r){return r.id!=='manager';}).map(function(r){var on=!!cm.roles[r.id], here=roleHasHub(r.id,cm.hub);
    return '<button onclick="cmRole(\''+r.id+'\')" title="'+(here?'':t('nobody holds that role there'))+'" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:6px 12px;border-radius:999px;border:1.5px solid '+(on?'#0EA5E9':'rgba(11,42,59,.14)')+';background:'+(on?'#E6F4FE':'#FFFFFF')+';color:'+(on?'#0A4A6B':'#0B2A3B')+'">@'+t(r.name)+(here?'':' <span style="opacity:.55">↗</span>')+'</button>';
   }).join('')
  +'<select oninput="cmSet(\'person\',this.value)" style="border:1.5px solid rgba(11,42,59,.15);border-radius:9px;padding:0 10px;height:var(--ctl-h);font-family:var(--body);background:#FFFFFF"><option value="">'+t('and a person (optional)')+'</option>'
  +PEOPLE.map(function(p){return '<option value="'+p.id+'"'+(cm.person===p.id?' selected':'')+'>'+p.name+'</option>';}).join('')+'</select>'
  +'</div>'
  +'<textarea oninput="cmSet(\'text\',this.value)" rows="2" placeholder="'+t('what needs to happen, and by whom')+'" style="width:100%;border:1.5px solid rgba(11,42,59,.15);border-radius:10px;padding:10px 12px;font-family:var(--body);font-size:var(--fs-body);background:#FFFFFF">'+String(cm.text).replace(/</g,'&lt;')+'</textarea>'
  +'<div style="display:flex;gap:10px;align-items:center;margin-top:9px;flex-wrap:wrap">'
  +'<span class="hint">'+(cmRoles().length
     ?(t('reaches')+': '+cmRoles().map(function(r){
        var p=readerOfRole(r,cm.hub);
        if(!p)return t(roleById(r).name)+' — '+t('nobody holds that role anywhere');
        return p.name+' <span class="machine">('+hubLabel(p.hub)+')</span>'
         +(p.elsewhere?' <b style="color:#78500A">⚠ '+t('not at')+' '+hubLabel(cm.hub)+'</b>':'')
         +(p.viaDelegate?' <span style="color:#0A4A6B">↷ '+t('delegate for')+' '+p.viaDelegate+'</span>':'');
       }).join(' · '))
     :t('pick at least one role — a message with no role is an obligation with nobody to own it'))+'</span>'
  +'<span style="margin-left:auto"></span>'
  +'<button id="cm-go" onclick="doPost()" '+(cmReady()?'':'disabled')+' style="cursor:'+(cmReady()?'pointer':'not-allowed')+';font-family:var(--body);font-weight:800;padding:0 20px;border-radius:10px;border:none;background:'+(cmReady()?'#10B981':'#E4E9F0')+';color:'+(cmReady()?'#FFFFFF':'rgba(11,42,59,.4)')+'">'+t('Post')+'</button>'
  +'</div>'
  +'<div class="hint" style="margin-top:7px">🔒 '+t('messages are permanent — an edit keeps its history, and the thread exports with the job')+'</div>'
  +'</div>';
 return h;
}


// ── the global bar: search · clock · notifications, on every screen ──
var GQ='', GSHOW=false, NOTIF_OPEN=false;
function setGQ(v){GQ=v;GSHOW=!!v;render();}
function gGo(screen,id){
 GQ='';GSHOW=false;
 if(id&&/^SL-|^BSH-|^CON-|^TRP-/.test(id)){CHAT_REF=recordExists(id)?id:CHAT_REF;}
 if(id&&itemById(id))openI=id;
 sim=screen;render();
}
function toggleNotif(){NOTIF_OPEN=!NOTIF_OPEN;render();}
function typeLabel(k){
 return {shipment:t('shipment'),trip:t('trip'),client:t('client'),work:t('work item'),
   person:t('person'),message:t('message'),cost:t('cost')}[k]||k;
}
function globalBar(){
 var groups=searchGrouped(GQ), unread=notifUnread().length;
 var h='<div class="card" style="padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
  +'<input type="text" value="'+String(GQ).replace(/"/g,'&quot;')+'" oninput="setGQ(this.value)" placeholder="'+t('one field — container, trip, client, invoice, plate, driver, message')+'" style="flex:1;min-width:240px;border:1.5px solid rgba(11,42,59,.15);border-radius:10px;padding:0 12px;height:var(--ctl-h);font-family:var(--body);font-size:var(--fs-body);background:#FFFFFF">'
  +clockRow(['Damascus','Istanbul','Dubai','Guangzhou'])
  +'<button onclick="toggleQC()" style="cursor:pointer;font-family:var(--body);font-weight:800;padding:0 14px;height:var(--ctl-h);border-radius:10px;border:none;background:#0A7250;color:#FFFFFF">+ '+t('New')+'</button>'
  +'<button onclick="toggleNotif()" style="cursor:pointer;position:relative;font-family:var(--body);font-weight:800;padding:0 14px;height:var(--ctl-h);border-radius:10px;border:1.5px solid '+(unread?'rgba(225,72,59,.45)':'rgba(11,42,59,.15)')+';background:'+(unread?'#FBE3E1':'#FFFFFF')+';color:'+(unread?'#991B1B':'#0B2A3B')+'">🔔 '+(unread?'<span class="machine">'+unread+'</span>':'')+'</button>'
  +'</div>';
 if(GSHOW&&GQ){
  h+='<div class="card" style="padding:var(--pad-card);margin-bottom:12px;border-color:#7DD3FC">'
   +'<div class="eyebrow" style="margin-bottom:8px">'+t('found')+' <span class="machine">'+searchAll(GQ).length+'</span> — '+t('grouped by type, with each record\'s status')+'</div>'
   +(groups.length?groups.map(function(g){
      return '<div style="margin-bottom:9px"><div class="eyebrow" style="margin-bottom:5px">'+typeLabel(g.type)+' · <span class="machine">'+g.rows.length+'</span></div>'
       +g.rows.slice(0,6).map(function(r){
         return '<button onclick="gGo(\''+r.go+'\',\''+r.id+'\')" style="cursor:pointer;display:block;width:100%;text-align:'+(currentLang==='ar'?'right':'left')+';padding:8px 11px;border-radius:9px;border:1.5px solid rgba(11,42,59,.09);background:#FFFFFF;margin-bottom:5px">'
          +'<span class="machine" style="font-weight:800">'+r.id+'</span> <span style="font-size:var(--fs-body)">'+r.label+'</span>'
          +'<span class="hint" style="float:'+(currentLang==='ar'?'left':'right')+'">'+r.status+'</span></button>';
        }).join('')+'</div>';
     }).join(''):'<div class="hint">'+t('nothing matches that — try a number or a name')+'</div>')
   +'</div>';
 }
 if(QC_OPEN)h+=qcPanel();
 if(NOTIF_OPEN)h+=notifPanel();
 return h;
}
function notifRow(x,wasRead){
 var it=x.item, m=x.msg;
 var read=!!wasRead;
 return '<div style="display:flex;gap:11px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;border:1.5px solid rgba(11,42,59,.09);margin-bottom:6px;background:'+(read?'#FDFCF9':'#FFFFFF')+';opacity:'+(read?'.6':'1')+'">'
  +'<div style="flex:1;min-width:180px">'
  +'<div style="font-size:var(--fs-body);font-weight:800">'+x.text+'</div>'
  +'<div class="hint machine">'+(it?(it.ref+' · '+((currentLang==='ar'?it.titleAr:it.title)||'')):(m?m.ref+' · '+m.text.slice(0,40):''))+'</div></div>'
  // actionable in place — no navigating away
  +(x.act==='ack'?'<button onclick="ack(\''+it.id+'\')" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:6px 12px;border-radius:9px;border:none;background:#0A7250;color:#FFFFFF">✓ '+t('Acknowledge')+'</button>':'')
  +(x.act==='open'?'<button onclick="gGo(\'s1\',\''+it.id+'\')" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:6px 12px;border-radius:9px;border:1.5px solid rgba(11,42,59,.18);background:#FFFFFF;color:#0B2A3B">'+t('open it')+'</button>':'')
  +(x.act==='assign'?'<button onclick="gGo(\'s2\',\''+it.id+'\')" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:6px 12px;border-radius:9px;border:none;background:#B23429;color:#FFFFFF">'+t('give it an owner')+'</button>':'')
  +(x.act==='thread'?'<button onclick="pickRecord(\''+m.ref+'\');gGo(\'s8\',\''+m.ref+'\')" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:6px 12px;border-radius:9px;border:1.5px solid rgba(14,165,233,.5);background:#F4FBFF;color:#0A4A6B">'+t('open the thread')+'</button>':'')
  +(read?'':'<span style="width:8px;height:8px;border-radius:50%;background:#0EA5E9;flex-shrink:0" title="'+t('new since you last looked')+'"></span>')
  +'</div>';
}
function notifPanel(){
 var g=notifGroups();
 var was=notifMarkSeen(notifications());
 var section=function(key,label,col){
  if(!g[key].length)return '';
  var fresh=g[key].filter(function(x){return !was[x.id];}).length;
  return '<div style="margin-bottom:10px"><div class="eyebrow" style="margin-bottom:6px;color:'+col+'">'+label+' · <span class="machine">'+g[key].length+'</span>'
   +(fresh?' · <span class="machine" style="color:#0A4A6B">'+fresh+' '+t('new')+'</span>':'')+'</div>'
   +g[key].map(function(x){return notifRow(x,was[x.id]);}).join('')+'</div>';
 };
 var total=g.critical.length+g.action.length+g.info.length;
 return '<div class="card" style="padding:var(--pad-card);margin-bottom:12px;border-color:rgba(225,72,59,.35)">'
  +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">'
  +'<span class="eyebrow">🔔 '+t('Notifications')+' — '+t('one inbox, grouped, actionable in place')+'</span>'
  +'<span style="margin-left:auto"></span>'
  +'<button onclick="toggleNotif()" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:5px 12px;border-radius:8px;border:1.5px solid rgba(11,42,59,.18);background:#FFFFFF;color:#0B2A3B">'+t('Close')+'</button></div>'
  +(total?section('critical','<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#B23429;vertical-align:middle"></span> '+t('Critical'),'#991B1B')+section('action','🟠 '+t('Action required'),'#78500A')+section('info','⚪ '+t('Informational'),'rgba(11,42,59,.5)')
        :'<div class="hint">'+t('nothing needs you right now')+'</div>')
  +'<div class="hint" style="margin-top:8px">'+t('opening this marks them read — a critical alert is still resolved, never silenced')+'</div>'
  +'</div>';
}


// ── quick create panel ──
var QC_OPEN=false, qcK='work', qcF={};
function toggleQC(){QC_OPEN=!QC_OPEN;qcF={};var ctx=qcContext();if(ctx.ref)qcF.ref=ctx.ref;if(ctx.trip)qcF.trip=ctx.trip;render();}
function qcKind(k){qcK=k;qcF={};var ctx=qcContext();if(ctx.ref)qcF.ref=ctx.ref;if(ctx.trip)qcF.trip=ctx.trip;render();}
function qcF_set(k,v){qcF[k]=v;}
function qcToggleRole(r){qcF.roles=qcF.roles||[];var i=qcF.roles.indexOf(r);if(i>-1)qcF.roles.splice(i,1);else qcF.roles.push(r);render();}
function doQC(){
 var r=quickCreateThing(qcK,qcF);
 if(!r.ok){
  askConfirm(t('Refused'),'<b style="color:#991B1B">'+(r.need?t('still missing')+': '+r.need.map(function(x){return t(x);}).join(' · '):t(r.why))+'</b>',t('Close'),true,function(){});
  return;
 }
 QC_OPEN=false;qcF={};
 var made=r.id;
 sim=r.goto;render();
 askConfirm(t('Created'),'<b class="machine">'+made+'</b>',t('Close'),false,function(){});
}
function qcInput(k,label,w2,type){
 return '<span style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">'+label+'</span>'
  +'<input type="'+(type||'text')+'" value="'+String(qcF[k]===undefined?'':qcF[k]).replace(/"/g,'&quot;')+'" oninput="qcF_set(\''+k+'\',this.value)" style="width:'+w2+';border:1.5px solid rgba(11,42,59,.15);border-radius:9px;padding:0 11px;height:var(--ctl-h);font-family:var(--body);font-size:var(--fs-body);background:#FFFFFF"></span>';
}
function qcPanel(){
 if(!QC_OPEN)return '';
 var ctx=qcContext();
 var h='<div class="card" style="padding:var(--pad-card);margin-bottom:12px;border:2px solid rgba(16,185,129,.5)">'
  +'<div style="display:flex;gap:10px;align-items:center;margin-bottom:9px">'
  +'<span class="eyebrow">+ '+t('Quick create')+'</span>'
  +(ctx.why?'<span class="hint">'+t('pre-filled from')+' '+t(ctx.why)+'</span>':'')

  +'<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px">'
  +QC_KINDS.map(function(k){var on=qcK===k.id;
    return '<button onclick="qcKind(\''+k.id+'\')" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:7px 13px;border-radius:999px;border:1.5px solid '+(on?'#10B981':'rgba(11,42,59,.14)')+';background:'+(on?'#DCF5E9':'#FFFFFF')+';color:'+(on?'#065F46':'#0B2A3B')+'">'+qcKindLabel(k.id)+'</button>';
   }).join('')
  +'</div><div style="display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end">';
 if(qcK==='work'){
  h+=qcInput('ref',t('record'),'150px')
   +'<span style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">'+t('role')+'</span>'
   +'<select oninput="qcF_set(\'role\',this.value)" style="border:1.5px solid rgba(11,42,59,.15);border-radius:9px;padding:0 11px;height:var(--ctl-h);font-family:var(--body);background:#FFFFFF"><option value="">—</option>'
   +ROLES.map(function(r){return '<option value="'+r.id+'">'+t(r.name)+'</option>';}).join('')+'</select></span>'
   +'<span style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">'+t('at')+'</span>'
   +'<select oninput="qcF_set(\'hub\',this.value)" style="border:1.5px solid rgba(11,42,59,.15);border-radius:9px;padding:0 11px;height:var(--ctl-h);font-family:var(--body);background:#FFFFFF">'
   +HUBS.map(function(hb){return '<option value="'+hb.id+'">'+hubLabel(hb.id)+'</option>';}).join('')+'</select></span>'
   +qcInput('next',t('next action'),'230px')
   +qcInput('due',t('due in hours'),'110px','number');
 } else if(qcK==='client'){
  h+=qcInput('name',t('name'),'180px')+qcInput('country',t('country'),'120px')+qcInput('contact',t('contact name'),'160px')
   +qcInput('phone',t('phone'),'150px')+qcInput('email',t('email'),'170px');
 } else if(qcK==='message'){
  h+=qcInput('ref',t('record'),'150px')
   +'<span style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">'+t('addressed to')+'</span>'
   +'<span style="display:flex;gap:5px;flex-wrap:wrap">'+ROLES.filter(function(r){return r.id!=='manager';}).map(function(r){
      var on=(qcF.roles||[]).indexOf(r.id)>-1;
      return '<button onclick="qcToggleRole(\''+r.id+'\')" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:6px 11px;border-radius:999px;border:1.5px solid '+(on?'#0EA5E9':'rgba(11,42,59,.14)')+';background:'+(on?'#E6F4FE':'#FFFFFF')+';color:'+(on?'#0A4A6B':'#0B2A3B')+'">@'+t(r.name)+'</button>';
     }).join('')+'</span></span>'
   +qcInput('text',t('message'),'260px');
 } else if(qcK==='cost'){
  h+='<span style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">'+t('trip')+'</span>'
   +'<select oninput="qcF_set(\'trip\',this.value)" style="border:1.5px solid rgba(11,42,59,.15);border-radius:9px;padding:0 11px;height:var(--ctl-h);font-family:var(--body);background:#FFFFFF"><option value="">—</option>'
   +TRIPS.map(function(tp){return '<option value="'+tp.id+'"'+(qcF.trip===tp.id?' selected':'')+'>'+tp.id+'</option>';}).join('')+'</select></span>'
   +qcInput('code',t('cost'),'140px')+qcInput('amount',t('amount'),'120px','number')+qcInput('supplier',t('supplier'),'160px');
 } else {
  h+=qcInput('text',t('what the next person needs to know'),'380px');
 }
 h+='<button onclick="doQC()" style="cursor:pointer;font-family:var(--body);font-weight:800;padding:0 20px;height:var(--ctl-h);border-radius:10px;border:none;background:#0A7250;color:#FFFFFF">'+t('Create')+'</button>'
  +'</div><div class="hint" style="margin-top:8px">'+t('it refuses to create a half-thing — every field it asks for, it needs')+'</div></div>';

// ── notice board ──
var nbDraft={kind:'advisory',en:'',ar:'',aud:{all:true,roles:[],hubs:[],countries:[],people:[]}}, NB_OPEN=false;
function nbSet(k,v){nbDraft[k]=v;}
function nbKind(k){nbDraft.kind=k;render();}
function nbAll(){nbDraft.aud={all:true,roles:[],hubs:[],countries:[],people:[]};render();}
function nbPick(kind,id){
 var a=nbDraft.aud; a.all=false;
 a[kind]=a[kind]||[];
 var i=a[kind].indexOf(id);
 if(i>-1)a[kind].splice(i,1); else a[kind].push(id);
 if(audienceEmpty(a))a.all=true;              // deselecting everything means everyone again
 render();
}
function nbAudCount(){
 var a=nbDraft.aud;
 if(a.all)return PEOPLE.length;
 return PEOPLE.filter(function(p){return noticeFor({audience:a},p);}).length;
}
function toggleNB(){NB_OPEN=!NB_OPEN;render();}
function doPostNotice(){
 var r=postNotice(nbDraft.kind,nbDraft.en,nbDraft.ar,ME.role,nbDraft.aud);
 if(!r.ok){askConfirm(t('Refused'),'<b style="color:#991B1B">'+t(r.why)+'</b>',t('Close'),true,function(){});return;}
 nbDraft={kind:'advisory',en:'',ar:'',aud:{all:true,roles:[],hubs:[],countries:[],people:[]}};NB_OPEN=false;
 render();
 if(r.notice.untranslated)askConfirm(t('Posted'),t('it went out in one language and is marked untranslated — add the other when you can'),t('Close'),false,function(){});
}

    return '<button onclick="nbKind(\''+k[0]+'\')" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:6px 12px;border-radius:999px;border:1.5px solid '+(on?'#0EA5E9':'rgba(11,42,59,.14)')+';background:'+(on?'#E6F4FE':'#FFFFFF')+';color:'+(on?'#0A4A6B':'#0B2A3B')+'">'+k[1]+'</button>';
   }).join('')

  +'<button onclick="toggleNB()" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:6px 12px;border-radius:9px;border:1.5px solid rgba(11,42,59,.18);background:#FFFFFF;color:#0B2A3B">'+t('Cancel')+'</button>'
  +'</div>'
  +'<div style="display:flex;gap:9px;flex-wrap:wrap">'
  +'<span style="flex:1;min-width:230px;display:flex;flex-direction:column;gap:4px"><span class="eyebrow">English</span>'
  +'<textarea oninput="nbSet(\'en\',this.value)" rows="2" placeholder="'+t('what everyone must know, and what to do about it')+'" style="width:100%;border:1.5px solid rgba(11,42,59,.15);border-radius:10px;padding:9px 11px;font-family:var(--body);font-size:var(--fs-body);background:#FFFFFF" dir="ltr">'+String(nbDraft.en).replace(/</g,'&lt;')+'</textarea></span>'

  +'<textarea oninput="nbSet(\'ar\',this.value)" rows="2" placeholder="'+t('the same, in Arabic')+'" style="width:100%;border:1.5px solid rgba(11,42,59,.15);border-radius:10px;padding:9px 11px;font-family:var(--body);font-size:var(--fs-body);background:#FFFFFF" dir="rtl">'+String(nbDraft.ar).replace(/</g,'&lt;')+'</textarea></span>'
  +'</div>'
  // who it is for
  +'<div style="margin-top:11px;padding-top:10px;border-top:1px solid rgba(11,42,59,.08)">'
  +'<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px">'
  +'<span class="hint" style="font-weight:800">'+t('who sees it')+':</span>'
  +'<button onclick="nbAll()" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:6px 12px;border-radius:999px;border:1.5px solid '+(nbDraft.aud.all?'#10B981':'rgba(11,42,59,.14)')+';background:'+(nbDraft.aud.all?'#DCF5E9':'#FFFFFF')+';color:'+(nbDraft.aud.all?'#065F46':'#0B2A3B')+'">'+t('everyone')+'</button>'
  +'</div>'
  +[['roles',ROLES.map(function(r){return [r.id,'@'+t(r.name)];})],
    ['hubs',HUBS.map(function(hb){return [hb.id,'📍'+hubLabel(hb.id)];})],
    ['countries',countriesLive().map(function(c){return [c.id,'🌐'+countryLabel(c.id)];})],

     return '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px">'
      +grp[1].map(function(x){
        var on=(nbDraft.aud[grp[0]]||[]).indexOf(x[0])>-1;
        return '<button onclick="nbPick(\''+grp[0]+'\',\''+x[0]+'\')" style="cursor:pointer;font-family:var(--body);font-size:var(--fs-hint);font-weight:800;padding:5px 11px;border-radius:999px;border:1.5px solid '+(on?'#0EA5E9':'rgba(11,42,59,.12)')+';background:'+(on?'#E6F4FE':'#FFFFFF')+';color:'+(on?'#0A4A6B':'rgba(11,42,59,.7)')+'">'+x[1]+'</button>';
       }).join('')+'</div>';
    }).join('')
  +'<div class="hint" style="margin-top:4px">'+t('reaches')+' <span class="machine">'+nbAudCount()+'</span> '+t('of')+' <span class="machine">'+PEOPLE.length+'</span> — '+audienceLabel(nbDraft.aud)+'</div>'
  +'</div>'
  +'<div style="display:flex;gap:10px;align-items:center;margin-top:9px;flex-wrap:wrap">'
  +'<span class="hint">'+t('one language is enough in a hurry — it will be marked untranslated')+'</span>'
  +'<span style="margin-left:auto"></span>'
  +'<button onclick="doPostNotice()" style="cursor:pointer;font-family:var(--body);font-weight:800;padding:0 20px;height:var(--ctl-h);border-radius:10px;border:none;background:#0A7250;color:#FFFFFF">'+t('Post to everyone')+'</button>'

// ── router ──
/* ── emoji → our own icons, at paint time ──────────────────────────
   Done here rather than by editing every string: an emoji sits inside JS
   concatenations a find-and-replace cannot read, and attempting that broke
   thirteen files. This is one wrapper at the paint point and cannot corrupt a
   literal. Typographic marks (check, arrow, warning) are deliberately left:

 '\u2696':'scale','\uD83D\uDEC3':'customs','\uD83C\uDFED':'factory','\uD83D\uDDFA':'map',

 '\uD83D\uDDC4':'box','\uD83C\uDFAF':'pin','\u23F8':'clock','\u25B6':'bolt','\uD83D\uDD04':'clock','\uD83D\uDCCE':'clip','\uD83D\uDCDE':'phone','\uD83D\uDD34':'alert','\uD83D\uDCE5':'box','\uD83D\uDEE1':'shield','\u26D4':'blocked','\u2705':'shield','\uD83C\uDFD9':'city','\uD83D\uDEAB':'blocked','\uD83D\uDEC2':'customs','\uD83E\uDDE9':'clip','\uD83E\uDEAA':'idcard','\uD83E\uDDD1':'person','\uD83D\uDD10':'shield','\uD83D\uDDDD':'key','\uD83D\uDD11':'key','\uD83E\uDDED':'compass','\uD83D\uDCCF':'ruler','\uD83D\uDEEB':'depart','\uD83E\uDDEE':'abacus','\uD83D\uDDC2':'folders','\uD83D\uDCDC':'scroll','\uD83C\uDFF7':'tag','\uD83D\uDC65':'people','\uD83D\uDEE0':'tools','\uD83C\uDFDB':'bank','\uD83D\uDCCB':'clipboard','\uD83D\uDCE4':'export','\uD83C\uDF81':'gift','\uD83C\uDFE0':'home','\uD83E\uDDEA':'flask','\uD83C\uDFC6':'trophy'};
function slIconize(html){
  if(!html)return html;
  // An emoji inside an attribute value — a placeholder, a title, an alt — must be left
  // alone: injecting an <svg> there shreds the tag. Split the string on tags and only
  // convert the text BETWEEN them.
  var parts=String(html).split(/(<[^>]*>)/g), i, k, seg;
  for(i=0;i<parts.length;i++){
    seg=parts[i];
    if(!seg||seg.charAt(0)==='<')continue;          // a tag: untouched
    for(k in SL_EMOJI){
      if(!SL_EMOJI.hasOwnProperty(k))continue;
      if(seg.indexOf(k)===-1)continue;
      seg=seg.split(k+'\uFE0F').join(slIcon(SL_EMOJI[k]));
      seg=seg.split(k).join(slIcon(SL_EMOJI[k]));
    }
    parts[i]=seg;
  }
  return parts.join('');
}

   A catalogue is different: every card is a real product someone may need to

function pager(key,total,label){

   +';color:'+(dis?'rgba(11,42,59,.35)':(on?'#0A4A6B':'#0B2A3B'))+'">'+txt+'</button>';
 };
 var nums='', start=Math.max(0,Math.min(PG.page-2,last-4)), end=Math.min(last,start+4), i;
 for(i=start;i<=end;i++)nums+=btn(i,String(i+1),i===PG.page,false);

  +'<span class="hint machine">'+from+'–'+to+' '+t('of')+' '+total+(label?' '+t(label):'')+'</span>'
  +'<span style="margin-inline-start:auto;display:flex;gap:5px;align-items:center">'
  +'<span class="hint">'+t('per page')+'</span>'

/* ── where everything actually is ────────────────────────────────────
   The chain now declares each step, so the state of the operation can be
   DERIVED rather than kept: no counter to fall out of step, no screen that
   believes something the log contradicts. Replaying the log is the only
   source of truth here — which is also why a corrected event fixes the
   picture without anybody editing a total.  */
var STAGES=[
 /* the customer apps count seven stages from the booking while this board
    counted six from the receipt, so the same shipment read differently
    depending on who was looking at it. One order, one list, everywhere. */
 {id:'expected',    ev:'shipment.expected',   en:'Expected',     ar:'متوقّعة'},
 {id:'received',    ev:'parcel.received',     en:'Received',     ar:'مستلَمة'},
 {id:'consolidated',ev:'parcel.consolidated', en:'Consolidated', ar:'مجمَّعة'},
 {id:'loaded',      ev:'trip.loaded',         en:'Loaded',       ar:'محمَّلة'},
 {id:'arrived',     ev:'shipment.arrived',    en:'Arrived',      ar:'واصلة'},
 {id:'assigned',    ev:'run.assigned',        en:'Out for delivery',ar:'في التسليم'},
 {id:'delivered',   ev:'shipment.delivered',  en:'Delivered',    ar:'مسلَّمة'}
];
function stageLabel(st2){var h='';STAGES.forEach(function(x){if(x.id===st2)h=(currentLang==='ar'?x.ar:x.en);});return h||st2;}
/* the furthest point each shipment has reached */
/* ── which cargo, not which vehicle ──────────────────────────────────
   This matched only e.ship — and the chain keys its later steps by the TRIP or
   the RUN, not by the cargo. So a real shipment stalled at "consolidated"
   forever while the board listed TRP-2608-014 and RUN-77 as though they were
   shipments of their own. Two changes, one idea: a step counts for a shipment
   when it NAMES it (e.ship, or payload.ships / payload.parcels), and an id that
   never appears as cargo is not cargo and is not listed. */
function shipEvNames(e){
 /* the shipments a step actually HAPPENED to. A failed delivery is not one of
    them: it names cargo, but the cargo did not arrive, and telling a client it
    did is the one mistake this screen must never make. */
 var out=[],p=e.payload||{},i;
 var lists=[p.ships,p.parcels];
 for(i=0;i<lists.length;i++){
  if(lists[i]&&lists[i].length)lists[i].forEach(function(x){if(x)out.push(String(x));});
 }
 return out;
}
function shipEvMentions(e){
 /* everything a step mentions — used only to decide what IS cargo, never to move it */
 var out=shipEvNames(e),p=e.payload||{};
 if(p.failedShips&&p.failedShips.length)p.failedShips.forEach(function(x){if(x)out.push(String(x));});
 return out;
}
/* ── the shipment register, derived and published ─────────────────────
   Nobody owned the shipments. The log said what happened to them and this board
   worked out where each stood, but that answer stayed here: every other module
   seeded its own ids, and B7 held five deliveries this board had never heard of.
   What is published is the ANSWER, derived on every pass and stored nowhere —
   the facts stay in the log where the people who did them wrote them. D1 owns
   the derivation, not the events. */
var SL_REG_SHIPS='SL_SHIPMENTS_V1';
function shipFacts(){
 var born=shipIsCargo(), order={}, out={}, k;
 STAGES.forEach(function(x,i){order[x.ev]=i;});
 try{
  slEvRead().forEach(function(e){
   var p=e.payload||{}, names=shipEvNames(e), i=order[e.type];
   if(e.ship&&born[String(e.ship)])names.push(String(e.ship));
   /* a failed attempt names the cargo without moving it, and it is counted */
   var failed=(p.failedShips||[]).slice();
   names.concat(failed).forEach(function(id){
    if(!born[id])return;
    if(!out[id])out[id]={ship:id,client:'',from:'',to:'',mode:'',weight:0,cartons:0,
                         price:null,stage:'',at:0,attempts:0,i:-1};
    var r=out[id];
    if(e.client&&!r.client)r.client=e.client;
    if(e.type==='parcel.received'){
     if(p.from&&!r.from)r.from=p.from;
     if(p.to&&!r.to)r.to=p.to;
     if(p.mode&&!r.mode)r.mode=p.mode;
     if(p.price&&!r.price)r.price=p.price;
     /* the WEIGHT, which the receipt has always measured and the register threw
        away. Nothing downstream could ask what a shipment weighs — and a VGM,
        which IS a certified weight, could not be produced at all. */
     if(p.weight&&!r.weight)r.weight=Number(p.weight)||0;
     if(p.cartons&&!r.cartons)r.cartons=Number(p.cartons)||0;
    }
   });
   failed.forEach(function(id){if(out[id])out[id].attempts++;});
   if(i===undefined)return;
   names.forEach(function(id){
    if(!born[id]||!out[id])return;
    if(i>out[id].i){out[id].i=i;out[id].stage=STAGES[i].id;out[id].at=e.at;}
   });
  });
 }catch(err){}
 var list=[];
 for(k in out)if(out.hasOwnProperty(k)){
  var r=out[k];
  /* the client's district travels with his shipment: it is his address, held
     once on his record, read here — not a field somebody types per parcel. */
  var who=null;
  clientsMerged().forEach(function(c){if(!who&&c.name===r.client)who=c;});
  list.push({ship:r.ship,client:r.client,area:(who&&who.area)||'',
             from:r.from,to:r.to,mode:r.mode,weight:r.weight||0,cartons:r.cartons||0,
             price:r.price,stage:r.stage||'expected',at:r.at,attempts:r.attempts,
             open:r.stage!=='delivered'});
 }

}
/* ── the trip register, derived like the shipment one ─────────────────
   B4 and B6 each held their own list of trips, so a trip created in B3 never
   reached the men who load and receive it, and the trip they worked on had
   never been created by anybody. The events already say everything: a trip was
   created with these shipments, loaded with this weight, departed, arrived.
   The answer is derived here and published; the facts stay in the log. */
var SL_REG_TRIPS='SL_TRIPS_V1';
var TRIP_STAGES=[{id:'created',ev:'trip.created'},{id:'loaded',ev:'trip.loaded'},
                 {id:'departed',ev:'trip.departed'},{id:'arrived',ev:'shipment.arrived'}];
function tripFacts(){
 var by={},order={},out=[],k;
 TRIP_STAGES.forEach(function(x,i){order[x.ev]=i;});
 try{
  slEvRead().forEach(function(e){
   var i=order[e.type]; if(i===undefined)return;
   var p=e.payload||{}, no=p.trip||e.ship;
   if(!no)return;
   no=String(no);
   if(!by[no])by[no]={no:no,mode:'',from:'',to:'',truck:'',driver:'',kg:0,
                      ships:[],stage:'',at:0,i:-1};
   var t2=by[no];
   if(p.truck&&!t2.truck)t2.truck=p.truck;
   if(p.driver&&!t2.driver)t2.driver=p.driver;
   if(p.from&&!t2.from)t2.from=p.from;
   if(p.to&&!t2.to)t2.to=p.to;
   if(p.hub&&!t2.to)t2.to=p.hub;
   if(p.mode&&!t2.mode)t2.mode=p.mode;
   if(p.kg&&!t2.kg)t2.kg=Number(p.kg)||0;
   (p.ships||[]).forEach(function(x){if(x&&t2.ships.indexOf(String(x))===-1)t2.ships.push(String(x));});
   if(i>t2.i){t2.i=i;t2.stage=TRIP_STAGES[i].id;t2.at=e.at;}
  });
 }catch(err){}
 for(k in by)if(by.hasOwnProperty(k)){
  var r=by[k];
  out.push({no:r.no,mode:r.mode,from:r.from,to:r.to,truck:r.truck,driver:r.driver,
            kg:r.kg,ships:r.ships.slice(),stage:r.stage||'created',at:r.at,
            open:r.stage!=='arrived'});

}

function shipIsCargo(){
 /* A shipment EXISTS because somebody took it in, or because it was booked and
    is expected. Nothing else creates one: a trip that lists an id nobody ever
    received is describing cargo that entered no warehouse, and putting it on
    the board would let a shipment appear from nowhere in the middle of the
    chain. Later steps MOVE a shipment; they do not conjure it. */
 var known={},BORN={'parcel.received':1,'shipment.expected':1};
 try{
  slEvRead().forEach(function(e){
   if(e.ship&&BORN[e.type])known[String(e.ship)]=1;
   /* consolidation is the one step that legitimately names parcels it did not
      itself receive — they were received a moment earlier, each on its own */
   if(e.type==='parcel.consolidated'){
    if(e.ship)known[String(e.ship)]=1;
    ((e.payload||{}).parcels||[]).forEach(function(x){if(x)known[String(x)]=1;});
   }
  });
 }catch(err){}
 return known;
}
function shipGhosts(){
 /* ids that a later step named but that were never received: not shipments —
    a fault worth seeing rather than a row worth drawing */
 var born=shipIsCargo(),out={},k;
 try{
  slEvRead().forEach(function(e){
   shipEvMentions(e).forEach(function(x){if(!born[x]&&!out[x])out[x]=e.type;});   /* the FIRST step that claimed it, not the last */
  });
 }catch(err){}
 var list=[];
 for(k in out)if(out.hasOwnProperty(k))list.push({ship:k,firstSeen:out[k]});

}
function shipmentStages(){

 STAGES.forEach(function(x,i){order[x.ev]=i;});
 try{
  slEvRead().forEach(function(e){
   if(order[e.type]===undefined)return;
   var i=order[e.type], names=shipEvNames(e);
   if(e.ship&&cargo[String(e.ship)])names.push(String(e.ship));
   names.forEach(function(id){
    if(!cargo[id])return;
    if(pos[id]===undefined||i>pos[id].i)pos[id]={i:i,at:e.at,actor:e.actor||''};
   });
  });
 }catch(err){}
 var out=[],k;
 for(k in pos)if(pos.hasOwnProperty(k))
  out.push({ship:k,stage:STAGES[pos[k].i].id,at:pos[k].at,actor:pos[k].actor});
 return out;
}
