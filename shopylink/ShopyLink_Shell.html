<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopyLink — Operations</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#F7F4EC;--paper:#FFFFFF;--ink:#0B2A3B;--mute:#62707A;
  --rule:rgba(11,42,59,.10);--sky:#0EA5E9;--green:#0A7250;--danger:#B23429;
  --disp:'Bricolage Grotesque',sans-serif;--body:'Manrope',sans-serif;
  --mono:'JetBrains Mono',monospace;--ar:'Tajawal',sans-serif;
  --ctl-h:42px;--sb-w:250px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);font-family:var(--body);color:var(--ink);overflow:hidden}

/* ── sign in ─────────────────────────────────────────────────────── */
.gate{position:fixed;inset:0;background:linear-gradient(160deg,#0B2A3B,#08202D);
  display:flex;align-items:center;justify-content:center;padding:22px;z-index:90;overflow:auto}
.gate-box{background:var(--paper);border-radius:18px;max-width:620px;width:100%;padding:26px;max-height:88vh;overflow:auto}
.gate-box h1{font-family:var(--disp);font-size:23px;margin:0 0 4px}
.gate-box .sub{color:var(--mute);font-size:13px;margin-bottom:16px}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}
.who-btn{cursor:pointer;text-align:start;font-family:var(--body);background:#fff;
  border:1.5px solid var(--rule);border-radius:11px;padding:10px 12px;min-height:64px}
.who-btn:hover{border-color:var(--sky);background:#F4FBFF}
.who-btn b{display:block;font-size:13.5px}
.who-btn span{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.who-btn .n{font-family:var(--mono);font-size:10px;color:var(--mute)}

/* ── the shell ───────────────────────────────────────────────────── */
.app{display:flex;height:100vh}
.side{width:var(--sb-w);flex:0 0 var(--sb-w);background:var(--ink);color:#fff;
  display:flex;flex-direction:column;overflow:hidden}
.side .brand{padding:15px 16px 13px;border-bottom:1px solid rgba(255,255,255,.09)}
.side .brand img{height:30px;width:auto;display:block}
.side .nav{flex:1;min-height:0;overflow-y:auto;padding:9px 0 16px}
.grp{padding:13px 16px 5px;font-size:10px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:rgba(255,255,255,.42)}
.lnk{display:flex;align-items:center;gap:9px;width:100%;cursor:pointer;text-align:start;
  background:none;border:none;color:rgba(255,255,255,.86);font-family:var(--body);
  font-size:13px;font-weight:600;padding:0 16px;height:38px}
.lnk:hover{background:rgba(255,255,255,.07);color:#fff}
.lnk.on{background:rgba(14,165,233,.2);color:#fff;font-weight:800;
  box-shadow:inset 3px 0 0 var(--sky)}
.side .foot{padding:11px 16px;border-top:1px solid rgba(255,255,255,.09);font-size:11px}
.side .foot b{display:block;font-size:12.5px;color:#fff}
.side .foot .r{color:rgba(255,255,255,.5)}
.side .foot button{margin-top:8px;width:100%;cursor:pointer;font-family:var(--body);
  font-size:11.5px;font-weight:800;height:32px;border-radius:8px;
  border:1px solid rgba(255,255,255,.28);background:none;color:#fff}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:11px;padding:0 18px;height:52px;
  background:var(--paper);border-bottom:1px solid var(--rule);flex:0 0 52px}
.crumb{font-size:13px;color:var(--mute)}
.crumb b{color:var(--ink);font-size:14px}
.bar .sp{margin-inline-start:auto}
.bar button{cursor:pointer;font-family:var(--body);font-size:12px;font-weight:800;
  height:32px;padding:0 12px;border-radius:8px;border:1.5px solid var(--rule);background:#fff;color:var(--ink)}
.stage{flex:1;min-height:0;position:relative;background:var(--canvas)}
.stage iframe{width:100%;height:100%;border:none;display:block;background:var(--canvas)}

/* ── the landing queue ───────────────────────────────────────────── */
.home{height:100%;overflow-y:auto;padding:20px 24px 40px}
.home h2{font-family:var(--disp);font-size:22px;margin:0 0 3px}
.home .hint{color:var(--mute);font-size:13px;margin-bottom:16px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:11px}
.qcard{background:var(--paper);border:1.5px solid var(--rule);border-radius:13px;padding:13px 15px}
.qcard .t{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.qcard .n{font-family:var(--disp);font-size:27px;line-height:1.15;margin:5px 0 2px}
.qcard .d{font-size:12px;color:var(--mute)}
.qcard button{margin-top:9px;cursor:pointer;font-family:var(--body);font-size:12px;
  font-weight:800;height:34px;padding:0 13px;border-radius:8px;border:none;background:#0B6E9B;color:#fff}
.empty{color:var(--mute);font-size:13px;padding:30px 0}
.machine{font-family:var(--mono);direction:ltr;unicode-bidi:embed}
[dir=rtl] body{font-family:var(--ar)}
[dir=rtl] .lnk.on{box-shadow:inset -3px 0 0 var(--sky)}
@media(max-width:820px){
  :root{--sb-w:64px}
  .side .brand img{height:22px}
  .lnk span.lbl,.grp,.side .foot b,.side .foot .r{display:none}
  .side .foot button{font-size:0;height:34px}
}

/* ── a sidebar that gets out of the way ──────────────────────────────
   Twenty-five modules in five categories is a column a person stares at all
   day. Collapsed it becomes a rail of first letters, and the choice is
   remembered — a control that forgets is a control nobody uses twice. */
.side.rail{width:56px;flex:0 0 56px}
.side.rail .lbl,.side.rail .grp,.side.rail .foot b,.side.rail .foot .r{display:none}
.side.rail .brand img{height:22px}
.side.rail .lnk{justify-content:center;padding:0}
.side.rail .lnk::before{content:attr(data-i);font-weight:800;font-size:13px}
.sb-toggle{min-height:44px;width:100%;background:none;border:0;color:rgba(255,255,255,.55);
  cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;
  border-top:1px solid rgba(255,255,255,.09)}
.sb-toggle:hover{color:#fff}
.sb-toggle:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
/* ── the day, and what head office is saying ── */
.day{border-radius:10px;padding:10px 13px;font-weight:700;font-size:13.5px;margin-bottom:12px}
.day.calm{background:#DCF5E9;color:#0A7250}
.day.busy{background:#E6F4FE;color:#0B6E9B}
.day.late{background:#FBE3E1;color:#B23429}
.day.flat{background:#EDE9E0;color:#62707A}
.note{display:flex;gap:9px;align-items:baseline;background:#FDF0D5;color:#8A5A06;
  border-radius:9px;padding:8px 12px;margin-bottom:7px;font-size:12.5px}
.note-k{font-weight:800;text-transform:uppercase;font-size:10px;letter-spacing:.08em;flex-shrink:0}
.note-b{flex:1}
.note-f{color:#62707A;font-size:11px;flex-shrink:0}
@media (max-width:720px){.side.rail{width:100%;flex:none}}
</style>
</head>

/* ── the staff registry: read it, or seed it so the shell can open ── */
function staff(){
 try{
  var raw=window.localStorage.getItem('SL_STAFF_V1');
  if(!raw&&STAFF_SEED){window.localStorage.setItem('SL_STAFF_V1',STAFF_SEED);raw=STAFF_SEED;}
  var o=JSON.parse(raw);
  return (o&&o.staff)?o.staff:[];
 }catch(e){
  try{return JSON.parse(STAFF_SEED).staff||[];}catch(e2){return [];}
 }
}
function personById(id){var h=null;staff().forEach(function(p){if(p.id===id)h=p;});return h;}
function may(perm){
 if(!ME)return false;
 return (ME.perms||[]).indexOf(perm)>-1;
}
/* a module is visible when the person can do at least one thing in it */
function canOpen(mod){
 var ps=mod[3]||[];
 if(!ps.length)return true;
 for(var i=0;i<ps.length;i++)if(may(ps[i]))return true;
 return false;
}
function visibleGroups(){
 var out=[];
 MODULES.forEach(function(g){
  var mods=g[3].filter(canOpen);
  if(mods.length)out.push([g[0],g[1],g[2],mods]);
 });
 return out;
}
function moduleByFile(f){
 var h=null;
 MODULES.forEach(function(g){g[3].forEach(function(m){if(m[0]===f)h=m;});});
 return h;
}

/* ── sign in ── */
function renderGate(){
 var list=staff().filter(function(p){return p.status==='active'&&p.role!=='driver';});
 var h='<div class="gate"><div class="gate-box">'
  +'<h1>'+t('signin')+'</h1><div class="sub">'+t('signinSub')+'</div>'
  +'<div class="who-grid">'
  +list.map(function(p){
    return '<button class="who-btn" onclick="signIn(\''+p.id+'\')">'
     +'<b>'+esc(p.name)+'</b>'
     +'<span>'+esc(p.role)+(p.hub?' · '+esc(p.hub):'')+'</span>'
     +'<span class="n">'+(p.perms||[]).length+' '+t('perms')+'</span>'
     +'</button>';
   }).join('')
  +'</div></div></div>';
 document.getElementById('gate').innerHTML=h;
 document.getElementById('gate').style.display='block';
 document.getElementById('app').style.display='none';
}
function signIn(id){
 ME=personById(id);
 if(!ME)return;
 document.getElementById('gate').style.display='none';
 document.getElementById('app').style.display='block';
 var want=(location.hash||'').replace(/^#\//,'');
 go(want&&moduleByFile(want)?want:'home');
}
function signOut(){
 ME=null;CUR=null;location.hash='';
 renderGate();
}

function countExpected(){
 var seen={},out=0;
 events().forEach(function(e){if(e.type==='parcel.received'&&e.ship)seen[e.ship]=1;});
 events().forEach(function(e){if(e.type==='shipment.expected'&&e.ship&&!seen[e.ship])out++;});
 return out;
}
function countQuotes(){
 var sent={},ans={};
 events().forEach(function(e){
  if(e.type==='quote.answered'&&e.payload)ans[e.payload.quote]=1;
 });
 try{
  var raw=window.localStorage.getItem('SL_QUOTES_BIZ_V1');
  if(raw){var o=JSON.parse(raw);(o.quotes||[]).forEach(function(q){if(!q.answer&&!ans[q.id])sent[q.id]=1;});}
 }catch(e){}
 var n=0,k;for(k in sent)if(sent.hasOwnProperty(k))n++;
 return n;
}
function countApprovals(){
 try{var r=window.localStorage.getItem('SL_APPROVALS_V1');if(!r)return 0;
  var o=JSON.parse(r);var l=o.approvals||o.items||[];
  return l.filter(function(a){return a.status==='pending'||!a.status;}).length;}catch(e){return 0;}
}
function card(title,desc,n,file){
 if(!n)return '';
 var m=moduleByFile(file);
 if(!m||!canOpen(m))return '';        /* never offer work the person cannot do */
 return '<div class="qcard"><div class="t">'+title+'</div>'
  +'<div class="n machine">'+n+'</div><div class="d">'+desc+'</div>'
  +'<button onclick="go(\''+file+'\')">'+t('open')+' →</button></div>';
}
/* ══ THE DASHBOARD ══════════════════════════════════════════════════════
   The shell already signs a person in, groups the modules into five
   categories, and hides every one he holds no grant in. What it did not do
   was READ anything: its home showed three counters worked out from its own
   fixtures, and the sidebar could not be got out of the way.
   Three things are added here, and nothing that exists elsewhere is rebuilt:
     · the sidebar collapses to a rail of icons and remembers the choice;
     · the home reads the registers the modules publish, so a figure on it and
       the same figure in D1 cannot disagree;
     · and every card is a piece of work SOMEBODY IN PARTICULAR owes — drawn
       from his duties, not from a list of everything the company is doing.
   A person is not shown a card he cannot act on: the card carries the button
   that opens the module, and `canOpen` already refuses the ones he may not.  */

/* ── reading, never writing: this screen owns nothing ── */
function dashRead(key, prop){
  try{
    var raw=window.localStorage.getItem(key); if(!raw)return null;
    var o=JSON.parse(raw);
    if(prop)return (o&&o[prop]&&o[prop].length)?o[prop]:null;
    return o;
  }catch(e){return null;}
}
function dashShips(){return dashRead('SL_SHIPMENTS_V1','shipments')||[];}
function dashTrips(){return dashRead('SL_TRIPS_V1','trips')||[];}
function dashApprovals(){var a=dashRead('SL_APPROVALS_V1');return (a&&a.length)?a:[];}
function dashNotices(){var o=dashRead('SL_NOTICES_V1');return (o&&o.notices)?o.notices:[];}
function dashEvents(){var a=dashRead('SL_EVENTS_V1');return (a&&a.length)?a:[];}
function dashLive(){
  /* "published and empty" is not "never published" — a quiet day and an unbuilt
     system look identical if you only count rows */
  try{return !!(window.localStorage.getItem('SL_SHIPMENTS_V1')||
                window.localStorage.getItem('SL_TRIPS_V1'));}catch(e){return false;}
}

/* ── what this person is owed, by his duties ── */
function myDuties(){
  var me=(typeof ME!=='undefined')?ME:null;
  if(!me||!me.id)return [];
  var reg=null;
  try{
    var raw=window.localStorage.getItem('SL_STAFF_V1');
    if(raw){var o=JSON.parse(raw);reg=(o&&o.staff)||null;}
  }catch(e){}
  if(!reg)return [];
  var hit=null;
  reg.forEach(function(p){if(!hit&&p.id===me.id)hit=p;});
  return (hit&&hit.duties)?hit.duties:[];
}
function hasDuty(kind){
  var d=myDuties();
  if(!d.length)return true;      /* no register: hide nothing */
  return d.indexOf(kind)>-1;
}

function nOpen(){return dashShips().filter(function(s){return s.open;}).length;}
function nReceived(){return dashShips().filter(function(s){return s.stage==='received';}).length;}
function nArrived(){return dashShips().filter(function(s){return s.stage==='arrived'||s.stage==='assigned';}).length;}
function nFailed(){return dashShips().filter(function(s){return s.open&&(s.attempts||0)>=2;}).length;}
function nTrips(){return dashTrips().filter(function(t){return t.open;}).length;}
function nUnbilled(){
  var issued={};
  dashEvents().forEach(function(e){if(e.type==='invoice.issued'&&e.ship)issued[e.ship]=1;});
  return dashShips().filter(function(s){return s.stage==='delivered'&&!issued[s.ship];}).length;
}
function nWaitingOnMe(){
  /* nobody signed in is a real state — the gate renders before anyone has —
     and asking for a level then must answer 0 rather than throw */
  var lv=(ME&&ME.level)?(Number(ME.level)||1):0;
  return dashApprovals().filter(function(a){
    return a.status==='pending'&&Number(a.level||3)<=lv;
  }).length;
}
function nStale(){
  var now=new Date().getTime(), two=2*24*3600*1000;
  return dashShips().filter(function(s){return s.open&&s.at&&(now-s.at)>two;}).length;
}

/* ── notices, with the audience their owner gave them ── */
function noticeMine(n){
  if(typeof ME==='undefined'||!ME||!ME.id)return true;
  var a=n.audience;
  if(!a||a.all)return true;
  if((a.people||[]).indexOf(ME.id)>-1)return true;
  if((a.roles||[]).indexOf(ME.role)>-1)return true;
  if((a.hubs||[]).indexOf(ME.hub)>-1)return true;
  return false;
}
function noticeStrip(){
  var ns=dashNotices().filter(noticeMine);
  if(!ns.length)return '';
  return ns.slice(0,3).map(function(n){
    var body=(LANG==='ar')?(n.ar||n.en):(n.en||n.ar);
    return '<div class="note"><span class="note-k">'+t(n.kind||'notice')+'</span>'
      +'<span class="note-b">'+body+'</span>'
      +'<span class="note-f">'+(n.by||'')+'</span></div>';
  }).join('');
}

/* ── the day in one line, from his own queue ── */
function dayLine(){
  if(!dashLive())return {kind:'flat',s:t('nothingPublished')};
  var late=nStale(), mine=nWaitingOnMe(), open=nOpen();
  if(late)return {kind:'late',s:late+' '+t('notMoved')+(mine?(' · '+mine+' '+t('waitingOnYou')):'')};
  if(!open&&!mine)return {kind:'calm',s:t('quietToday')};
  return {kind:'busy',s:open+' '+t('onTheMove')+(mine?(' · '+mine+' '+t('waitingOnYou')):'')};
}

function renderHome(){
 var d=dayLine();
 var cards=[
  /* each card is work somebody OWES, and it is drawn only for the person whose
     duty it is: an accountant does not need the count of parcels waiting to be
     measured in Dubai, and showing it to him teaches him to ignore the screen */
  hasDuty('measure')  ? card(t('received'),  t('receivedD'),  nReceived(), 'ShopyLink_Action_02_Consolidation.html') : '',
  hasDuty('document') ? card(t('tripsOpen'), t('tripsOpenD'), nTrips(),    'ShopyLink_Action_03_CreateTrip.html')   : '',
  hasDuty('deliver')  ? card(t('toDeliver'), t('toDeliverD'), nArrived(),  'ShopyLink_Action_07_Dispatcher.html')   : '',
  hasDuty('deliver')  ? card(t('failedTwice'),t('failedTwiceD'),nFailed(), 'ShopyLink_Action_08_Delivery.html')     : '',
  hasDuty('invoice')  ? card(t('unbilled'),  t('unbilledD'),  nUnbilled(), 'ShopyLink_Action_09_Billing.html')      : '',
  hasDuty('profile')  ? card(t('quotes'),    t('quotesD'),    countQuotes(),'ShopyLink_Action_09_Billing.html')     : '',
  card(t('approvals'), t('approvalsD'), nWaitingOnMe(), 'ShopyLink_Action_C12_Approvals.html')
 ].filter(Boolean);
 return '<div class="home">'
  + noticeStrip()
  + '<div class="day '+d.kind+'">'+d.s+'</div>'
  + '<h2>'+t('home')+'</h2>'
  + '<div class="hint">'+t('todayHint')+'</div>'
  + (cards.length
      ? '<div class="qgrid">'+cards.join('')+'</div>'
      : '<div class="empty">'+t('nothingForYou')+'</div>')
  + '</div>';
}

/* ── navigation ── */
function go(where){
 if(!ME)return;
 if(where!=='home'){
  var m=moduleByFile(where);
  /* the menu hides it; this refuses it. A hidden link is not a locked door. */
  if(!m||!canOpen(m)){ alert(t('noaccess')); return; }
 }
 CUR=where;
 location.hash='#/'+where;
 render();
}
function crumb(){
 if(CUR==='home')return '<b>'+t('home')+'</b>';
 var m=moduleByFile(CUR);
 if(!m)return '';
 var grp='';
 MODULES.forEach(function(g){g[3].forEach(function(x){if(x[0]===CUR)grp=(LANG==='ar'?g[2]:g[1]);});});
 return esc(grp)+' › <b>'+esc(LANG==='ar'?m[2]:m[1])+'</b>';
}
/* remembered, because a person who collapses it wants it collapsed tomorrow.
   Read on every pass, not once at load: the third time this week I have written
   a reader that answers from a snapshot taken before the answer existed. */
var RAIL=false;
function railOn(){
 try{RAIL=(window.localStorage.getItem('SL_SHELL_RAIL')==='1');}catch(e){}
 return RAIL;
}
railOn();
function toggleRail(){
 RAIL=!RAIL;
 try{window.localStorage.setItem('SL_SHELL_RAIL',RAIL?'1':'0');}catch(e){}
 render();
}

      +'<span class="lbl">'+esc(LANG==='ar'?m[2]:m[1])+'</span></button>';
