<body>
<div class="bar">
  <button onclick="flip()" id="lang">العربية</button>
  <button onclick="window.print()">Print</button>
  <button class="go" id="declare" onclick="declareVGM()">Declare it sent</button>
</div>
<div class="hint" id="hint"></div>
<div class="sheet" id="sheet"></div>

<script>
/* ══ VGM — Verified Gross Mass ══════════════════════════════════════════
   SOLAS will not let a container be loaded without a certified gross mass, and
   the system knew that: the document gate asks for a VGM on every sea trip, and
   the control board carries a work item — "VGM to carrier", with an owner and a
   hard cut-off eight hours out. Nothing could produce the paper.
   This produces it, and invents nothing. Every figure is read:
     · the trip, its container and its route from SL_TRIPS_V1
     · the cargo and each shipment's weight from SL_SHIPMENTS_V1
     · the tare from SL_TRUCKS_V1 — the real one. The trip module used to
       assume 8,500 kg for a lorry that weighs 15,200, and a VGM built on that
       would have been a certified false weight.
     · the port from SL_STOPS_V1
   The owner weighs actually, so the method is stated as WEIGHED, which SOLAS
   requires to be declared. And the signature is left BLANK for the pen: the
   paper is signed after it is printed, so nobody's name is put under a figure
   he has not seen. */

function readCh(key,prop){
  try{
    var raw=window.localStorage.getItem(key); if(!raw)return null;
    var o=JSON.parse(raw);
    return prop?((o&&o[prop]&&o[prop].length)?o[prop]:null):o;
  }catch(e){return null;}
}
function trips(){return readCh('SL_TRIPS_V1','trips')||[];}
function ships(){return readCh('SL_SHIPMENTS_V1','shipments')||[];}
function trucks(){return readCh('SL_TRUCKS_V1','trucks')||[];}
function stops(){return readCh('SL_STOPS_V1','stops')||[];}

var TRIP=null;
function seaTrips(){
  return trips().filter(function(t){return t.mode==='sea'&&t.open;});
}
function pickTrip(){
  var list=seaTrips();
  if(!list.length)list=trips().filter(function(t){return t.open;});
  return TRIP||list[0]||null;
}
function truckOf(t){
  var hit=null;
  trucks().forEach(function(k){if(t&&(k.plate===t.truck||k.id===t.truck))hit=k;});
  return hit;
}
function cargoOf(t){
  if(!t)return [];
  var by={}; ships().forEach(function(s){by[s.ship]=s;});
  return (t.ships||[]).map(function(id){return by[id]||{ship:id};});
}

/* ── the weight, and what it is made of ── */
function weights(){
  var t=pickTrip(), k=truckOf(t), cargo=cargoOf(t);
  var goods=0, weighed=true, unknown=[];
  cargo.forEach(function(s){
    var w=Number(s.weight)||0;
    if(!w){weighed=false;unknown.push(s.ship);}
    goods+=w;
  });
  var tare=k?(Number(k.tare)||0):0;
  return {trip:t,truck:k,cargo:cargo,goods:goods,tare:tare,
          total:(tare&&goods)?(tare+goods):0,
          complete:!!(t&&k&&tare&&goods&&weighed),
          unknown:unknown};
}
function kg(n){
  if(!n)return '';
  var s=String(Math.round(Number(n)));
  return s.replace(/\B(?=(\d{3})+(?!\d))/g,',')+' kg';
}

var LANG='en';
function t(en,ar){return LANG==='ar'?ar:en;}
function flip(){
  LANG=(LANG==='ar')?'en':'ar';
  document.documentElement.setAttribute('dir',LANG==='ar'?'rtl':'ltr');
  document.documentElement.setAttribute('lang',LANG);
  document.getElementById('lang').textContent=LANG==='ar'?'English':'العربية';
  render();
}

function field(k,v,cls){
  return '<div class="f"><div class="k">'+k+'</div><div class="v '+(cls||'')+'">'
    +(v||'<span class="miss">'+t('not on the record','غير مسجَّل')+'</span>')+'</div></div>';
}
function render(){
  var w=weights(), t2=w.trip, k=w.truck;
  var port=null;
  stops().forEach(function(s){if(!port&&t2&&s.kind==='port'&&(s.name===t2.to||s.id===t2.to))port=s;});

  var h='<div class="top"><div><h1>'+t('Verified Gross Mass','الوزن الإجمالي المصدَّق')+'</h1>'
    +'<div class="sub">'+t('SOLAS VI/2 — declared by the shipper before loading',
                           'سولاس VI/2 — يُقرّه الشاحن قبل التحميل')+'</div></div>'
    +'<div class="ref">'+(t2?t2.no:'—')+'<br>'+t('issued','صدرت')+' '
    +new Date().toISOString().slice(0,10)+'</div></div>';

  h+='<div class="grid">'
    + field(t('Shipper','الشاحن'),'ShopyLink')
    + field(t('Trip','الرحلة'),t2?t2.no:'','machine')
    + field(t('Vehicle / container','المركبة أو الحاوية'),k?(k.plate+' · '+(k.model||k.type||'')):'','machine')
    + field(t('Route','المسار'),t2?((t2.from||'?')+' → '+(t2.to||'?')):'','machine')
    + field(t('Port of loading','ميناء التحميل'),port?port.name:(t2?t2.from:''))
    + field(t('Method of determination','طريقة التحديد'),
            t('Method 1 — the packed unit was WEIGHED','الطريقة 1 — وُزنت الوحدة المعبّأة فعليًّا'))
    + '</div>';

  h+='<table><thead><tr><th>'+t('Shipment','الشحنة')+'</th><th>'+t('Client','العميل')+'</th>'
    +'<th style="text-align:right">'+t('Weight','الوزن')+'</th></tr></thead><tbody>';
  if(!w.cargo.length){
    h+='<tr><td colspan="3" style="color:var(--n6);padding:14px 0">'
      +t('this trip carries nothing the register knows',
         'هذه الرحلة لا تحمل ما يعرفه السجل')+'</td></tr>';
  }
  w.cargo.forEach(function(s){
    h+='<tr><td class="machine" style="font-family:var(--mono)">'+s.ship+'</td>'
      +'<td>'+(s.client||'—')+'</td>'
      +'<td style="text-align:right;font-family:var(--mono)">'
      +(Number(s.weight)?kg(s.weight):'<span class="miss">'+t('not weighed','لم تُوزن')+'</span>')
      +'</td></tr>';
  });
  h+='</tbody><tfoot>'
    +'<tr><td colspan="2">'+t('Cargo','البضاعة')+'</td><td style="text-align:right">'+(kg(w.goods)||'—')+'</td></tr>'
    +'<tr><td colspan="2">'+t('Tare of the vehicle','الوزن الفارغ للمركبة')+'</td><td style="text-align:right">'+(kg(w.tare)||'—')+'</td></tr>'
    +'</tfoot></table>';

  h+='<div class="grid"><div class="f" style="grid-column:1/-1;border-bottom:0">'
    +'<div class="k">'+t('VERIFIED GROSS MASS','الوزن الإجمالي المصدَّق')+'</div>'
    +'<div class="v big">'+(w.total?kg(w.total):'<span class="miss">'+t('cannot be certified','لا يمكن تصديقه')+'</span>')+'</div></div></div>';

  if(!w.complete){
    var why=[];
    if(!t2)why.push(t('no trip','لا رحلة'));
    if(t2&&!k)why.push(t('the vehicle is not on the fleet register','المركبة ليست في سجل الأسطول'));
    if(w.unknown.length)why.push(t('not weighed: ','لم تُوزن: ')+w.unknown.join(', '));
    h+='<div class="note">'+t('This cannot be signed as it stands — ','لا يجوز توقيع هذه كما هي — ')
      +why.join(' · ')+'</div>';
  }

  /* the signature is left for the pen: the owner signs after printing, so
     nobody's name is printed under a figure he has not read */
  h+='<div class="sign">'
    +'<div><div class="blank"></div><div class="line"><b>'+t('Signed for the shipper','توقيع الشاحن')+'</b>'
    +t('name, position and date','الاسم والمنصب والتاريخ')+'</div></div>'
    +'<div><div class="blank"></div><div class="line"><b>'+t('Weighbridge / weighing party','الميزان الجسري أو جهة الوزن')+'</b>'
    +t('certificate reference','مرجع شهادة الوزن')+'</div></div></div>';

  document.getElementById('sheet').innerHTML=h;

  var btn=document.getElementById('declare');
  btn.disabled=!w.complete;
  btn.textContent=t('Declare it sent','أعلن إرسالها');
  document.getElementById('hint').textContent = w.complete
    ? t('Print it, sign it, send it to the carrier — then declare it, and the document gate closes itself.',
        'اطبعها ووقّعها وأرسلها إلى الناقل، ثم أعلن ذلك فتُغلق بوّابة المستندات من نفسها.')
    : t('Every figure here is read from the registers. Nothing is typed in, so nothing can be certified that was not weighed.',
        'كل رقم هنا مقروء من السجلات. لا شيء يُكتب هنا، فلا يُصدَّق ما لم يُوزن.');
}

/* ── declaring it ── */
function evRead(){
  try{var r=window.localStorage.getItem('SL_EVENTS_V1');if(!r)return [];
   var l=JSON.parse(r);return l&&l.length?l:[];}catch(e){return [];}
}
function declareVGM(){
  var w=weights();
  /* refused at the act, not by the button: a certified weight that nobody
     weighed is worse than a missing document */
  if(!w.complete)return {ok:false,why:'the mass cannot be certified from what is recorded'};
  var l=evRead();
  var already=false;
  l.forEach(function(e){if(e.type==='vgm.submitted'&&e.ship===w.trip.no)already=true;});
  if(already)return {ok:false,why:'this trip has already declared its VGM'};
  l.push({id:'EV-'+(l.length+1)+'-'+(new Date()).getTime(),at:(new Date()).getTime(),
          type:'vgm.submitted',ship:w.trip.no,client:null,actor:'',
          payload:{trip:w.trip.no,ships:(w.trip.ships||[]).slice(),
                   vgm:w.total,tare:w.tare,cargo:w.goods,cur:'kg',
                   method:'weighed'}});
  try{window.localStorage.setItem('SL_EVENTS_V1',JSON.stringify(l));}catch(e){}
  render();
  return {ok:true,vgm:w.total};
}
render();
</script>
